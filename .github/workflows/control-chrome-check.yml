name: Control Chrome check
on:
  push:
    branches: [pkg/17-chrome-check]
    paths:
      - control/checks/17-chrome/**
      - .github/workflows/control-chrome-check.yml
      - reviews/17-chrome-check/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chrome-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install official Google Chrome stable and X display helpers
        run: |
          mkdir -p .work/17-chrome/artifacts .work/17-chrome/config
          curl --fail --location --retry 3 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o .work/17-chrome/chrome.deb
          sudo apt-get update -qq
          sudo apt-get install -y ./.work/17-chrome/chrome.deb xvfb xdotool x11-utils openbox imagemagick
          rm .work/17-chrome/chrome.deb
          google-chrome-stable --version | tee .work/17-chrome/artifacts/chrome-version.txt
          uname -a > .work/17-chrome/artifacts/platform.txt
          cat /etc/os-release >> .work/17-chrome/artifacts/platform.txt
          git rev-parse HEAD | tee .work/17-chrome/artifacts/head.txt
          printf '%s attempt %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tee .work/17-chrome/artifacts/run.txt
      - name: Install pinned check dependencies (no browser download)
        working-directory: control/checks/17-chrome
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --json > ../../../.work/17-chrome/artifacts/dependencies.json
      - name: Run headed fixture checks with Chrome sandbox enabled
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.work/17-chrome/config
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' bash -c '
            openbox > .work/17-chrome/artifacts/openbox.log 2>&1 &
            for wm_attempt in $(seq 1 100); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | rg -q "window id"; then break; fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | rg -q "window id" || exit 1
            timeout --kill-after=15s 20m node control/checks/17-chrome/run.mjs
          ' 2>&1 | tee .work/17-chrome/artifacts/check.log
      - name: Upload synthetic logs and structural page views
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrome-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/17-chrome/artifacts/
          retention-days: 14
          if-no-files-found: error
