name: OS image
run-name: ${{ inputs.rehearsal && format('Two-disk rehearsal ({0})', inputs.rehearsal) || inputs.check_build && format('OS image check build ({0}, never published)', inputs.check_build) || inputs.checks_only && 'OS regressions only (no VM)' || inputs.release_13 && 'Package 13 image release' || inputs.release_27 && 'Package 27 image release' || inputs.switch_from_run && 'OS published-image switch only' || 'OS image' }}

on:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: 'Package 11: inspect pinned ISO or rehearse installation; never build/publish'
        type: choice
        options: ['', inspect, fixture, probe, part-b, keyboard, owner-tools, update, reorder-probe]
        default: ''
      release_13:
        description: 'One private org keyboard release; package 13 branch only'
        type: boolean
        default: false
      release_27:
        description: 'One private org update release (packages 21, 22, 24); package 27 branch only'
        type: boolean
        default: false
      checks_only:
        description: 'Run regressions and live host state query; no image build or VM'
        type: boolean
        default: false
      probe_run:
        description: '11l Part B requires the passing probe run ID at this exact commit'
        type: string
        default: ''
      switch_from_run:
        description: 'Optional prior run with successful image job; retry only its published-image switch test'
        type: string
        default: ''
      check_build:
        description: 'Throwaway image (package 21): resolve inputs or build and check this ref; never pushes, signs or publishes'
        type: choice
        options: ['', resolve, build]
        default: ''
      full_model:
        description: 'Checks only: run the full ways-back model even when none of its sources changed'
        type: boolean
        default: false

permissions:
  contents: read

env:
  REHEARSAL_PACKAGE: ${{ github.ref_name == 'pkg/22c-ways-back-after-update' && '22c' || github.ref_name == 'pkg/27-first-update-release' && '27' || github.ref_name == 'pkg/16-staged-release' && '16' || github.ref_name == 'pkg/14-owner-tools' && '14' || github.ref_name == 'pkg/13-keyboard-layout' && '13' || '11c' }}

concurrency:
  group: os-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regressions:
    name: Regression checks only (no image build or VM)
    if: github.event_name == 'workflow_dispatch' && inputs.checks_only && !inputs.rehearsal && github.ref_name != 'pkg/16-staged-release'
    runs-on: ubuntu-24.04
    # The suite explores a bounded slice of 22c's ways-back model; the full model
    # runs in the model job below (22c stage 1b, addition 1).
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The suite reads files of earlier commits (git show, git diff).
          fetch-depth: 0
      - name: Reserve package 13 checks budget
        if: github.ref_name == 'pkg/13-keyboard-layout' || github.ref_name == 'pkg/27-first-update-release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: checks
        run: python3 os/ci/rehearsal_guard.py ci 15
      - name: Install framebuffer regression dependency on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil python3-yaml
      # test_owner_update.ToolsUpdateTest runs the tools' update as root in an
      # unprivileged user and mount namespace (unshare -Urm). Ubuntu 24.04's
      # AppArmor refuses that by default (uid_map: Operation not permitted) and
      # the tests skip; this is the only place they can run (27c).
      - name: Allow unprivileged user namespaces on disposable runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Urm true
      - name: Run regression and syntax checks
        env:
          ARESOS_MODEL_SCOPE: slice
        run: |
          set -euo pipefail
          env -u REHEARSAL_PACKAGE python3 -m unittest discover -s os/tests -v
          python3 -m py_compile os/ci/*.py os/ci/overlay/*.py os/owner-tools/*.py
          bash -n os/owner-tools/at
          pwsh -NoProfile -File os/tests/owner-tools.Tests.ps1 -Bundle os/owner-tools/payload -Work .work/owner-tools-unit-copy
          for script in os/ci/*.sh os/release/*.sh; do bash -n "$script"; done
          python3 -m py_compile os/ci/*.py os/ci/overlay/*.py os/tests/audit.py os/tests/power-events.py
          for script in os/ci/*.sh os/release/*.sh os/ci/overlay/updater-generator os/build.sh os/tests/*.sh os/config/usr/bin/aresos-session os/config/usr/bin/aresos-terminal; do
            bash -n "$script"
          done
      - name: Query the real hosted system manager (no image or VM)
        run: |
          PYTHONPATH=os/tests python3 - <<'PY'
          from audit import live_states
          files, units = live_states(['systemctl', '--no-pager', '--no-legend'])
          assert '-.mount' in units and units['-.mount']['load_state'] == 'loaded', units.get('-.mount')
          print(f'Live hosted system manager passed: {len(files)} unit files, {len(units)} unit names')
          PY
      - name: Record the org package-metadata limitation
        if: github.ref_name != 'pkg/13-keyboard-layout' && github.ref_name != 'pkg/27-first-update-release'
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json, pathlib
          pathlib.Path('evidence/package-metadata-access.json').write_text(json.dumps(dict(
              status='not-possible-from-org-job-token', visibility_verified=False,
              reason='User-owned package cannot grant Actions access to this org repository; owner secret is forbidden in this job')) + '\n')
          print('Package visibility metadata NOT VERIFIED from the org; no owner-token API request made')
          PY
      - name: Verify private org metadata with job token
        if: github.ref_name == 'pkg/13-keyboard-layout' || github.ref_name == 'pkg/27-first-update-release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p evidence
          gh api orgs/Ares-Empire/packages/container/aresos --jq '{name,visibility}' > evidence/package-visibility.json
          test "$(jq -r .visibility evidence/package-visibility.json)" = private
      - name: Resolve release inputs without pulling image layers
        run: |
          mkdir -p evidence
          python3 os/ci/release-inputs.py
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1
      - name: Verify candidate upstream signature
        run: cosign verify --key os/keys/bazzite.pub "$(jq -r .reference evidence/base-candidate.json)" > evidence/base-candidate-signature.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-inputs
          path: evidence/
          retention-days: 3
  model:
    name: Full ways-back model when its sources changed (no image build or VM)
    if: github.event_name == 'workflow_dispatch' && inputs.checks_only && !inputs.rehearsal && github.ref_name != 'pkg/16-staged-release'
    runs-on: ubuntu-24.04
    # 22c's exhaustive model took 12 to 21 minutes on hosted runners (1275 s in run
    # 43547375701); it runs beside the regressions job, not inside it.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The decision needs the merge base with main.
          fetch-depth: 0
      - name: Decide between the full model and the bounded slice
        id: scope
        env:
          FULL_MODEL: ${{ inputs.full_model }}
        run: python3 os/ci/model_scope.py --force "$FULL_MODEL" >> "$GITHUB_OUTPUT"
      - name: Install the model's dependencies on disposable runner
        if: steps.scope.outputs.scope == 'full'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil python3-yaml
      - name: Run the full ways-back model
        if: steps.scope.outputs.scope == 'full'
        env:
          ARESOS_MODEL_SCOPE: full
        run: env -u REHEARSAL_PACKAGE python3 -m unittest discover -s os/tests -p test_ways_back_model.py -k test_reachable_state_space -v
  check-build:
    name: Throwaway image build and checks (never pushed, signed or published)
    if: github.event_name == 'workflow_dispatch' && github.ref_name != 'pkg/16-staged-release' && inputs.check_build != '' && !inputs.rehearsal && !inputs.release_13 && !inputs.release_27 && !inputs.checks_only && !inputs.switch_from_run
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Read-only on purpose: no packages/id-token permission and no secrets, so
    # this job cannot push, sign or publish the image it builds.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: 'true'
      - name: Install pinned tools on disposable runner
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash os/ci/install-tools.sh
          { podman --version; skopeo --version; node --version; } > evidence/tool-versions.txt
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1
      - name: Verify pinned upstream image
        run: |
          set -euo pipefail
          image=$(jq -r .reference os/manifest/base.json)
          test "$(awk '/^FROM / {print $2; exit}' os/Containerfile)" = "$image"
          cosign verify --key os/keys/bazzite.pub "$image" > evidence/base-signature.json
      - name: Resolve or build and check the image in local storage only
        timeout-minutes: 80
        env:
          CHECK_BUILD_MODE: ${{ inputs.check_build }}
        run: bash os/ci/check-build.sh "$CHECK_BUILD_MODE"
      - name: Bound evidence
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" evidence
          test "$(du -sb evidence | cut -f1)" -lt 180000000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: check-build-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: error
  image:
    if: github.event_name == 'workflow_dispatch' && inputs.release_13 && github.ref_name == 'pkg/13-keyboard-layout' && !inputs.checks_only && !inputs.switch_from_run && !inputs.rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reserve package 13 release-13 budget
        if: github.ref_name == 'pkg/13-keyboard-layout'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: release-13
        run: python3 os/ci/rehearsal_guard.py ci 90
      - name: Start quota measurements
        run: |
          mkdir -p evidence
          date +%s > evidence/start-time.txt
          python3 os/ci/metrics.py --sample &
          echo "$!" > /tmp/aresos-metrics.pid
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: 'true'
      - name: Install tools on disposable runner
        run: |
          set -euo pipefail
          bash os/ci/install-tools.sh
          sudo modprobe nbd max_part=8
          df -B1 / > evidence/post-cleanup-disk.txt
          env -u REHEARSAL_PACKAGE python3 -m unittest discover -s os/tests -v
          python3 -m py_compile os/ci/*.py os/ci/overlay/*.py os/owner-tools/*.py
          bash -n os/owner-tools/at
          for script in os/ci/*.sh os/release/*.sh; do bash -n "$script"; done
          python3 -m py_compile os/ci/*.py os/ci/overlay/*.py os/tests/audit.py os/tests/power-events.py
          for script in os/ci/*.sh os/release/*.sh os/ci/overlay/updater-generator os/build.sh os/tests/*.sh os/config/usr/bin/aresos-session os/config/usr/bin/aresos-terminal; do
            bash -n "$script"
          done
          { podman --version; skopeo --version; qemu-system-x86_64 --version; dpkg-query -W ovmf; } > evidence/tool-versions.txt
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1
      - name: Verify pinned upstream image
        run: |
          set -euo pipefail
          image=$(jq -r .reference os/manifest/base.json)
          test "$(awk '/^FROM / {print $2; exit}' os/Containerfile)" = "$image"
          printf '%s\n' "$image" | tee evidence/base-reference.txt
          cosign verify --key os/keys/bazzite.pub "$image" > evidence/base-signature.json
          openssl pkey -pubin -in os/keys/bazzite.pub -outform DER | sha256sum > evidence/base-key-sha256.txt
          skopeo inspect "docker://$image" > evidence/base-inspect.json
          skopeo inspect --raw "docker://$image" > evidence/base-oci-manifest.json
          df -B1 / | tee evidence/runner-disk.txt
      - name: Resolve all privileged host tools before credentials
        env:
          REHEARSAL_MODE: release-13
        run: python3 os/ci/build_tools.py resolve evidence/build-tools.json
      - name: Authorize only the historical private image read for comparison
        if: github.event_name == 'workflow_dispatch' && inputs.release_13 && github.ref_name == 'pkg/13-keyboard-layout'
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          REHEARSAL_MODE: release-13
        run: sudo -E python3 os/ci/rehearsal_auth.py create
      - name: Build the keyboard overlay and fail closed on the complete image diff
        timeout-minutes: 30
        env:
          REHEARSAL_MODE: release-13
        run: |
          set -euo pipefail
          date +%s > evidence/build-start-time.txt
          python3 os/ci/build_tools.py launch "$PWD/evidence/build-tools.json"
      - name: Remove historical image credentials
        if: always()
        env:
          REHEARSAL_MODE: release-13
        run: sudo -E python3 os/ci/rehearsal_auth.py cleanup
      - name: Build isolated test overlay and prove release excludes it
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint /usr/bin/bash localhost/aresos:ci -ec '
            test ! -e /usr/libexec/aresos-ci
            test ! -e /usr/lib/systemd/system/aresos-ci.service
            test ! -e /usr/lib/systemd/system-generators/aresos-ci-updater-regression
            test ! -e /etc/systemd/system/aresos-ci-routine.service
            test ! -e /etc/systemd/system/aresos-ci-routine.timer
            test ! -e /etc/systemd/system/aresos-ci-static-canary.service
            test ! -e /usr/lib/systemd/system/multi-user.target.wants/aresos-ci.service
            test ! -e /tmp/aresos
            test ! -e /etc/systemd/system/systemd-logind.service.d/90-aresos-ci.conf
            test ! -e /etc/systemd/journald.conf.d/99-aresos-ci.conf
            test "$(systemd-analyze cat-config systemd/journald.conf | sed -n "s/^Storage=//p" | tail -1)" = persistent
            for user in root ares; do
              case "$(getent shadow "$user" | cut -d: -f2)" in
                \!*|\**) ;;
                *) echo "Unlocked image account: $user"; exit 1 ;;
              esac
            done
            echo "Release excludes CI service and credentials; both passwords locked"
          ' | tee evidence/release-isolation.txt
          sudo podman build --format=oci --tag localhost/aresos:vm --file os/ci/overlay/Containerfile .
          sudo skopeo inspect --raw containers-storage:localhost/aresos:vm > evidence/vm-image-oci-manifest.json
          sha256sum evidence/vm-image-oci-manifest.json > evidence/vm-image-digest.txt
          sudo podman image inspect localhost/aresos:vm > evidence/vm-image-inspect.json
      - name: Build file-backed UEFI VM disk
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python3 os/ci/prepare-disk.py
          mkdir -p vm-work/output
          builder=$(jq -r .builder os/manifest/base.json)
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/vm-work/config.toml:/config.toml:ro" \
            -v "$PWD/vm-work/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$builder" --type raw --rootfs btrfs --use-librepo=True localhost/aresos:vm
          sudo chmod -R a+rX vm-work/output
      - name: Boot QEMU and assert session, policy and recovery
        timeout-minutes: 20
        run: |
          set -euo pipefail
          for pass in 1 2; do
            sudo -E env ARESOS_VM_PASS="$pass" python3 os/ci/vm.py
          done
      - name: Publish the tested private release and sign with GitHub OIDC
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: release-13
        run: bash os/ci/publish.sh
      - name: Measure and bound evidence
        id: evidence
        if: always()
        run: |
          python3 os/ci/metrics.py
          sudo chown -R "$(id -u):$(id -g)" evidence
          test "$(du -sb evidence | cut -f1)" -lt 180000000
          echo 'safe=true' >> "$GITHUB_OUTPUT"
          cat evidence/metrics.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.evidence.outputs.safe == 'true'
        with:
          name: os-image-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: error
  release-27:
    name: Package 27 release build, image diff, VM and publish
    if: github.ref_name == 'pkg/27-first-update-release' && github.event_name == 'workflow_dispatch' && inputs.release_27 && !inputs.release_13 && !inputs.checks_only && !inputs.switch_from_run && !inputs.rehearsal && inputs.check_build == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reserve package 27 release budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: release-27
        run: python3 os/ci/rehearsal_guard.py ci 180
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: 'true'
      - name: Install pinned tools on disposable runner
        # Runs 42831158090 and 42835704653 stopped here on snapshot.ubuntu.com
        # 500/504 answers; this job retries longer than the shared default.
        timeout-minutes: 40
        env:
          ARESOS_APT_RETRIES: '5'
          ARESOS_APT_TIMEOUT: '60'
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash os/ci/install-tools.sh
          { podman --version; skopeo --version; qemu-system-x86_64 --version; dpkg-query -W ovmf; node --version; } > evidence/tool-versions.txt
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1
      - name: Verify pinned upstream image
        run: |
          set -euo pipefail
          image=$(jq -r .reference os/manifest/base.json)
          test "$(awk '/^FROM / {print $2; exit}' os/Containerfile)" = "$image"
          printf '%s\n' "$image" | tee evidence/base-reference.txt
          cosign verify --key os/keys/bazzite.pub "$image" > evidence/base-signature.json
      - name: Resolve all privileged host tools before credentials
        env:
          REHEARSAL_MODE: release-27
        run: python3 os/ci/build_tools.py resolve evidence/build-tools.json
      - name: Build with the reviewed check build, run the image checks and the first VM pass
        timeout-minutes: 90
        run: bash os/ci/check-build.sh build
      - name: Prove the release excludes the CI layer and keeps both passwords locked
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint /usr/bin/bash localhost/aresos:ci -ec '
            test ! -e /usr/libexec/aresos-ci
            test ! -e /usr/lib/systemd/system/aresos-ci.service
            test ! -e /usr/lib/systemd/system-generators/aresos-ci-updater-regression
            test ! -e /etc/systemd/system/aresos-ci-routine.service
            test ! -e /etc/systemd/system/aresos-ci-routine.timer
            test ! -e /etc/systemd/system/aresos-ci-static-canary.service
            test ! -e /usr/lib/systemd/system/multi-user.target.wants/aresos-ci.service
            test ! -e /tmp/aresos
            test ! -e /etc/systemd/system/systemd-logind.service.d/90-aresos-ci.conf
            test ! -e /etc/systemd/journald.conf.d/99-aresos-ci.conf
            test "$(systemd-analyze cat-config systemd/journald.conf | sed -n "s/^Storage=//p" | tail -1)" = persistent
            for user in root ares; do
              case "$(getent shadow "$user" | cut -d: -f2)" in
                \!*|\**) ;;
                *) echo "Unlocked image account: $user"; exit 1 ;;
              esac
            done
            echo "Release excludes CI service and credentials; both passwords locked"
          ' | tee evidence/release-isolation.txt
      - name: Prepare job-token credentials for release 13
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: release-27
        run: sudo -E python3 os/ci/registry_auth.py create
      - name: Verify release 13 and fail closed on the complete image diff
        timeout-minutes: 60
        env:
          REHEARSAL_MODE: release-27
        run: python3 os/ci/build_tools.py launch "$PWD/evidence/build-tools.json"
      - name: Remove release 13 credentials
        if: always()
        env:
          REHEARSAL_MODE: release-27
        run: sudo -E python3 os/ci/registry_auth.py cleanup
      - name: Publish the tested private release and sign with GitHub OIDC
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: release-27
        run: bash os/ci/publish.sh
      - name: Bound evidence
        id: evidence
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" evidence
          test "$(du -sb evidence | cut -f1)" -lt 180000000
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.evidence.outputs.safe == 'true'
        with:
          name: os-image-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: error
  switch:
    name: Published-image switch and rollback
    needs: image
    if: always() && !cancelled() && github.ref_name != 'pkg/16-staged-release' && github.ref_name != 'pkg/27-first-update-release' && !inputs.release_13 && !inputs.release_27 && !inputs.checks_only && !inputs.rehearsal && (needs.image.result == 'success' || inputs.switch_from_run != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: os-image-evidence
          path: evidence/
          run-id: ${{ inputs.switch_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require qualified release and unchanged runtime payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN: ${{ inputs.switch_from_run || github.run_id }}
        run: python3 os/ci/verify_release.py "$RELEASE_RUN"
      - name: Start switch quota measurements
        run: |
          cp evidence/metrics.json evidence/image-metrics.json
          : > evidence/disk-samples.jsonl
          date +%s > evidence/start-time.txt
          python3 os/ci/metrics.py --sample &
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: 'true'
      - name: Install tools and construct stock upstream disk
        timeout-minutes: 45
        run: |
          set -euo pipefail
          bash os/ci/install-tools.sh
          python3 os/ci/prepare-disk.py --stock
          mkdir -p switch-work/output
          base=$(jq -r .reference os/manifest/base.json)
          builder=$(jq -r .builder os/manifest/base.json)
          sudo podman pull "$base"
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/switch-work/config.toml:/config.toml:ro" \
            -v "$PWD/switch-work/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$builder" --type raw --rootfs btrfs --use-librepo=True "$base"
      - name: Switch to published digest, reboot, authenticate on tty3 and roll back
        timeout-minutes: 27
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sudo -E python3 os/ci/switch_vm.py
      - name: Measure switch evidence
        if: always()
        run: |
          python3 os/ci/metrics.py
          sudo chown -R "$(id -u):$(id -g)" evidence
          test "$(du -sb evidence | cut -f1)" -lt 180000000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: os-switch-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: error
  rehearsal:
    name: Pinned live ISO inspection and two-disk rehearsal
    if: github.event_name == 'workflow_dispatch' && inputs.rehearsal != '' && (github.ref_name != 'pkg/16-staged-release' || (inputs.rehearsal == 'probe' && !inputs.release_13 && !inputs.checks_only && !inputs.switch_from_run && !inputs.probe_run)) && (inputs.rehearsal == 'update') == (github.ref_name == 'pkg/27-first-update-release') && (github.ref_name == 'pkg/27-first-update-release' && !inputs.release_13 && !inputs.release_27 && !inputs.checks_only && !inputs.switch_from_run && !inputs.probe_run || github.ref_name != 'pkg/27-first-update-release') && (inputs.rehearsal == 'reorder-probe') == (github.ref_name == 'pkg/22c-ways-back-after-update') && (github.ref_name != 'pkg/22c-ways-back-after-update' || !inputs.release_13 && !inputs.release_27 && !inputs.checks_only && !inputs.switch_from_run && !inputs.probe_run && inputs.check_build == '')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.ref_name == 'pkg/22c-ways-back-after-update' && 345 || inputs.rehearsal == 'update' && 300 || inputs.rehearsal == 'owner-tools' && 240 || (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release') && inputs.rehearsal == 'probe' && 70 || (inputs.rehearsal == 'part-b' || inputs.rehearsal == 'keyboard') && 130 || 40 }}
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reserve the separate 11c minute budget (including privacy checks)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
          PROBE_RUN: ${{ inputs.probe_run }}
        run: python3 os/ci/rehearsal_guard.py '${{ ((github.ref_name == 'pkg/13-keyboard-layout' || (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release')) && inputs.rehearsal == 'probe' || github.ref_name == 'pkg/27-first-update-release' && inputs.rehearsal == 'update' || github.ref_name == 'pkg/22c-ways-back-after-update') && 'probe-budget-ci' || 'ci' }}' '${{ github.ref_name == 'pkg/22c-ways-back-after-update' && 345 || inputs.rehearsal == 'update' && 300 || inputs.rehearsal == 'owner-tools' && 240 || (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release') && inputs.rehearsal == 'probe' && 72 || (inputs.rehearsal == 'part-b' || inputs.rehearsal == 'keyboard') && 130 || 42 }}'
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: 'true'
      - name: Install pinned rehearsal tools on disposable runner
        # Package 27's update rehearsal (run 42933781975 took 16 of 20 minutes
        # here) gets the release job's patience with the snapshot mirror; every
        # other rehearsal keeps three retries, apt's own timeouts and 20 minutes.
        timeout-minutes: ${{ (inputs.rehearsal == 'update' || github.ref_name == 'pkg/22c-ways-back-after-update') && 40 || 20 }}
        env:
          ARESOS_APT_RETRIES: ${{ (inputs.rehearsal == 'update' || github.ref_name == 'pkg/22c-ways-back-after-update') && '5' || '' }}
          ARESOS_APT_TIMEOUT: ${{ (inputs.rehearsal == 'update' || github.ref_name == 'pkg/22c-ways-back-after-update') && '60' || '' }}
        run: |
          set -euo pipefail
          mkdir -p evidence .work/installer
          bash os/ci/install-tools.sh
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libarchive-tools squashfs-tools gnu-efi ntfs-3g dosfstools exfatprogs exfat-fuse gdisk mtools psmisc tesseract-ocr python3-venv
          dpkg-query -W > evidence/rehearsal-host-packages.txt
      - name: Prove package 14 native host capabilities before expensive downloads
        if: (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release') || github.ref_name == 'pkg/27-first-update-release' || github.ref_name == 'pkg/22c-ways-back-after-update'
        timeout-minutes: 3
        env:
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: sudo -E python3 os/ci/owner_capabilities.py
      - name: Qualify tools, regressions, rewritten release identity and private access
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages .work/browser-env
          .work/browser-env/bin/pip --retries 5 --timeout 60 install playwright==1.58.0
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/.work/browsers"
          printf 'Acquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/80ares-playwright-retries >/dev/null
          .work/browser-env/bin/playwright install --with-deps chromium
          .work/browser-env/bin/python -c 'import crypt, PIL, playwright.sync_api'
          dpkg-query -W > evidence/rehearsal-host-packages.txt
          env -u REHEARSAL_PACKAGE python3 -m unittest discover -s os/tests -v
          if test "$GITHUB_REF_NAME" = pkg/14-owner-tools || test "$GITHUB_REF_NAME" = pkg/16-staged-release || test "$GITHUB_REF_NAME" = pkg/27-first-update-release || test "$GITHUB_REF_NAME" = pkg/22c-ways-back-after-update; then
            sudo -E env -u GH_TOKEN python3 os/ci/owner_devices.py
            sudo -E env -u GH_TOKEN python3 os/ci/owner_counter_kernel.py
          fi
          pwsh -NoProfile -File os/tests/owner-tools.Tests.ps1 -Bundle os/owner-tools/payload -Work .work/owner-tools-unit-copy
          python3 -m py_compile os/ci/*.py os/ci/overlay/*.py os/owner-tools/*.py
          bash -n os/owner-tools/at
          for script in os/ci/*.sh os/release/*.sh; do bash -n "$script"; done
          cp os/manifest/release.json evidence/release.json
          python3 os/ci/verify_release.py "$(jq -r .run evidence/release.json | sed 's|.*/||')"
      - name: Require completed native preflight before any package 13 VM
        if: (github.ref_name == 'pkg/13-keyboard-layout' || (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release')) && inputs.rehearsal == 'probe' || github.ref_name == 'pkg/27-first-update-release' && inputs.rehearsal == 'update' || github.ref_name == 'pkg/22c-ways-back-after-update'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: python3 os/ci/rehearsal_guard.py ci '${{ github.ref_name == 'pkg/22c-ways-back-after-update' && 345 || inputs.rehearsal == 'update' && 300 || (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release') && 72 || 42 }}'
      - name: Create runner-temporary pinned-image credentials
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'pkg/13-keyboard-layout' && github.ref_name != 'pkg/14-owner-tools' && github.ref_name != 'pkg/16-staged-release' && github.ref_name != 'pkg/27-first-update-release' && (inputs.rehearsal == 'probe' || inputs.rehearsal == 'part-b')
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: sudo -E python3 os/ci/rehearsal_auth.py create
      - name: Prepare package 13 job-token credentials without owner-secret fallback
        if: (github.ref_name == 'pkg/13-keyboard-layout' || (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release')) && (inputs.rehearsal == 'probe' || inputs.rehearsal == 'keyboard' || inputs.rehearsal == 'owner-tools') || github.ref_name == 'pkg/27-first-update-release' && inputs.rehearsal == 'update' || github.ref_name == 'pkg/22c-ways-back-after-update'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: sudo -E python3 os/ci/registry_auth.py create
      - name: Verify exact private manifest with scoped credentials
        if: github.event_name == 'workflow_dispatch' && (inputs.rehearsal == 'probe' || inputs.rehearsal == 'part-b' || inputs.rehearsal == 'keyboard' || inputs.rehearsal == 'owner-tools' || inputs.rehearsal == 'update' || github.ref_name == 'pkg/22c-ways-back-after-update')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: sudo -E python3 os/ci/registry_auth.py preflight
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release') || github.ref_name == 'pkg/27-first-update-release' || github.ref_name == 'pkg/22c-ways-back-after-update'
        with:
          cosign-release: v2.6.1
      - name: Verify the exact private signature natively for the offline guest
        if: (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release') || github.ref_name == 'pkg/27-first-update-release' || github.ref_name == 'pkg/22c-ways-back-after-update'
        env:
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: sudo -E python3 os/ci/registry_auth.py signature "$(command -v cosign)"
      - name: Qualify the exact pinned layer pull without installing
        if: github.event_name == 'workflow_dispatch' && (inputs.rehearsal == 'probe' || inputs.rehearsal == 'part-b' || inputs.rehearsal == 'keyboard' || inputs.rehearsal == 'owner-tools' || inputs.rehearsal == 'update' || github.ref_name == 'pkg/22c-ways-back-after-update')
        timeout-minutes: 9
        env:
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: sudo -E python3 os/ci/registry_auth.py pull
      - name: Inspect the exact pinned live ISO before assuming an installer path
        if: inputs.rehearsal != 'fixture'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p evidence/installer .work/installer
          python3 os/ci/installer_inspect.py
      - name: Prepare disposable file disks and qualify the real live environment
        if: inputs.rehearsal != 'inspect'
        timeout-minutes: ${{ github.ref_name == 'pkg/22c-ways-back-after-update' && 315 || inputs.rehearsal == 'update' && 270 || inputs.rehearsal == 'owner-tools' && 200 || (inputs.rehearsal == 'part-b' || inputs.rehearsal == 'keyboard') && 106 || 80 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/.work/browsers"
          sudo python3 os/ci/prepare_two_disks.py
          if test '${{ inputs.rehearsal }}' = fixture; then
            sudo python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'os/ci')
          from disk_audit import offline_disk, boot_variables
          result = dict(status='passed', vm_started=False,
                        protected=offline_disk(pathlib.Path('.work/installer/protected.raw').resolve()),
                        nvram=boot_variables('.work/installer/vars.fd'))
          pathlib.Path('evidence/native-fixture.json').write_text(json.dumps(result, indent=2) + '\n')
          print('Native file-backed GPT/EFI/MSR/NTFS/recovery and offline audit passed; no VM started')
          PY
          elif test "$REHEARSAL_PACKAGE" = 14 || test "$REHEARSAL_PACKAGE" = 16 || test "$REHEARSAL_PACKAGE" = 27 || test "$REHEARSAL_PACKAGE" = 22c; then
            sudo -E .work/browser-env/bin/python os/ci/owner_vm.py '${{ inputs.rehearsal }}'
          elif test "$REHEARSAL_PACKAGE" = 13; then
            sudo -E .work/browser-env/bin/python os/ci/keyboard_vm.py '${{ inputs.rehearsal }}'
