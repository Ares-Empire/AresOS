      - name: Remove owner registry credentials
        if: always() && github.ref_name != 'pkg/13-keyboard-layout' && github.ref_name != 'pkg/14-owner-tools' && github.ref_name != 'pkg/16-staged-release' && github.ref_name != 'pkg/27-first-update-release' && github.ref_name != 'pkg/22c-ways-back-after-update'
        env:
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: sudo -E python3 os/ci/rehearsal_auth.py cleanup
