        if: always() && (github.ref_name == 'pkg/13-keyboard-layout' || (github.ref_name == 'pkg/14-owner-tools' || github.ref_name == 'pkg/16-staged-release') || github.ref_name == 'pkg/27-first-update-release' || github.ref_name == 'pkg/22c-ways-back-after-update')
        env:
          REHEARSAL_MODE: ${{ inputs.rehearsal }}
        run: sudo -E python3 os/ci/registry_auth.py cleanup
      - name: Bound retained evidence
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" evidence
          test "$(du -sb evidence | cut -f1)" -lt 180000000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: two-disk-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: error
