name: Control Chrome qualification
on:
  push:
    branches: [pkg/20-chrome-qual, main]
    paths: ['control/**', 'docs/control/TOOLS.md', 'reviews/20-chrome/QUALIFICATION*', 'reviews/20-chrome/audit-review-evidence.mjs', '.github/workflows/control-chrome-qualification.yml', '.github/workflows/control-chrome.yml']
  pull_request:
    branches: [pkg/20-chrome, main]
    paths: ['control/**', 'docs/control/TOOLS.md', 'reviews/20-chrome/QUALIFICATION*', 'reviews/20-chrome/audit-review-evidence.mjs', '.github/workflows/control-chrome-qualification.yml', '.github/workflows/control-chrome.yml']
  workflow_dispatch:
  schedule:
    - cron: '19 4 * * *'
permissions:
  contents: read
concurrency:
  group: control-chrome-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Browser-free build, service, delivery and hermetic publisher tests
        run: |
          set -euo pipefail
          mkdir -p .work/20-chrome
          PYTHONPATH=control:control/chrome_tests python3 -m unittest test_build test_publisher test_qualification test_qualification_service -v 2>&1 | tee .work/20-chrome/qualification-tests.txt
          node --test control/chrome_tests/*.test.mjs 2>&1 | tee .work/20-chrome/node-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/20-chrome/*tests.txt
  # Every job runs on pull requests too (main fix H4). Only the writes that
  # reach GitHub (the push to the data branch, issues, pull requests) are
  # main-only, as steps below and in qualify.py's own guard. A pull request
  # qualifies one channel to keep its cost at half of main's matrix.
  qualification-plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_matrix: ${{ steps.plan.outputs.shard_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_CHANNELS: ${{ github.ref == 'refs/heads/main' && 'stable,beta' || 'stable' }}
        run: |
          set -euo pipefail
          python3 control/chrome/qualify.py plan --channels "$QUALIFICATION_CHANNELS" > qualification-plan.json
          echo "matrix=$(cat qualification-plan.json)" >> "$GITHUB_OUTPUT"
          echo "shard_matrix=$(python3 control/chrome/ci/qualification-shards.py qualification-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-plan
          path: qualification-plan.json
  qualification-pairs:
    needs: qualification-plan
    if: needs.qualification-plan.result == 'success' && needs.qualification-plan.outputs.matrix != '' && fromJSON(needs.qualification-plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualification-plan.outputs.shard_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.commit }}
          path: runtime
          persist-credentials: false
      - name: Check exact installed runtime and add only the common test driver
        env:
          EXPECTED_BUILD: ${{ matrix.build }}
        run: |
          set -euo pipefail
          test "$(python3 runtime/control/chrome/build.py)" = "$EXPECTED_BUILD"
          cp -R driver/control/chrome/ci/. runtime/control/chrome/ci/
          cp -R driver/control/chrome_tests/. runtime/control/chrome_tests/
          cp -R driver/control/boundary/. runtime/control/boundary/
          mkdir -p runtime/.github/workflows
          cp driver/.github/workflows/control-chrome-qualification.yml driver/.github/workflows/control-chrome.yml runtime/.github/workflows/
      - name: Build the requested channel in a disposable container
        if: ${{ !startsWith(matrix.shard, 'python-') && matrix.shard != 'precedence' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          PACKAGE_URL: ${{ matrix.package_url }}
          PACKAGE_SHA256: ${{ matrix.package_sha256 }}
        run: tar -C runtime -cf - control docs/control/TOOLS.md .github/workflows/control-chrome-qualification.yml .github/workflows/control-chrome.yml | docker build --build-arg CHANNEL="$CHANNEL" --build-arg PACKAGE_URL="$PACKAGE_URL" --build-arg PACKAGE_SHA256="$PACKAGE_SHA256" -t qualification -f control/chrome/ci/Dockerfile -
      - name: Browser shard in a Linux container; repeat is an independent pair
        if: ${{ !startsWith(matrix.shard, 'python-') && matrix.shard != 'precedence' }}
        env:
          INSTALL_MODE: policy
          BROWSER_SHARD: ${{ matrix.shard }}
          ACT_INPUT_BOUNDARY: ${{ matrix.shard == 'recheck2' && 'true' || 'false' }}
          QUALIFICATION_VERSION: ${{ matrix.version }}
          RUNTIME_COMMIT: ${{ matrix.commit }}
        run: |
          mkdir -p .work/20-chrome/ci
          timeout --signal=TERM --kill-after=30s 120m docker run --rm --network none --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --shm-size=512m -e INSTALL_MODE -e BROWSER_SHARD -e ACT_INPUT_BOUNDARY -e QUALIFICATION_VERSION -e RUNTIME_COMMIT -e GITHUB_RUN_ID -e GITHUB_SHA -v "$PWD/.work/20-chrome/ci:/out" qualification
      - name: Full Python file partition
        if: ${{ startsWith(matrix.shard, 'python-') }}
        env:
          PAIR_SHARD: ${{ matrix.shard }}
          RUNTIME_COMMIT: ${{ matrix.commit }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p .work/20-chrome/ci
          PYTHON_SHARD="${PAIR_SHARD#python-}" TEST_OUT="$PWD/.work/20-chrome/ci" python3 runtime/control/chrome/ci/python-shard.py 2>&1 | tee .work/20-chrome/ci/python.txt
      - name: Real native precedence for this runtime
        if: matrix.shard == 'precedence'
        env:
          RUNTIME_COMMIT: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          mkdir -p .work/20-chrome/ci
          docker build -f runtime/control/boundary/Dockerfile -t qualification-precedence runtime
          timeout --signal=TERM --kill-after=30s 25m docker run --rm --network none --cap-add SYS_PTRACE --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined -e PRECEDENCE_ONLY=true -e RUNTIME_COMMIT -e GITHUB_SHA -e GITHUB_RUN_ID -v "$PWD/.work/20-chrome/ci:/evidence" qualification-precedence 2>&1 | tee .work/20-chrome/ci/console.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-shard-${{ matrix.build }}-${{ matrix.channel }}-${{ matrix.repeat }}-${{ matrix.shard }}
          path: .work/20-chrome/ci/
  qualification-combine:
    needs: [qualification-plan, qualification-pairs]
    if: always() && needs.qualification-plan.result == 'success' && needs.qualification-plan.outputs.matrix != '' && fromJSON(needs.qualification-plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualification-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.commit }}
          path: runtime
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qualification-shard-${{ matrix.build }}-${{ matrix.channel }}-${{ matrix.repeat }}-*
          path: runtime/.work/shards
      - name: Require complete browser Python and native evidence
        id: suite
        working-directory: runtime
        env:
          INSTALL_MODE: policy
          RUNTIME_COMMIT: ${{ matrix.commit }}
          QUALIFICATION_PAIR: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          cp -R ../driver/control/chrome/ci/. control/chrome/ci/
          cp -R ../driver/control/chrome_tests/. control/chrome_tests/
          mkdir -p .work/20-chrome/ci
          node control/chrome/ci/merge-shards.mjs .work/shards .work/20-chrome/ci ".work/shards/qualification-shard-${{ matrix.build }}-${{ matrix.channel }}-${{ matrix.repeat }}-precedence/chrome-precedence.json"
          python3 control/chrome/ci/merge-python.py .work/shards .work/20-chrome/ci
          node ../driver/reviews/20-chrome/audit-review-evidence.mjs .work/20-chrome/ci > .work/20-chrome/ci/independent-audit.json
          node --input-type=module -e "import {recordCompletion} from '../driver/control/chrome_tests/qualification-completion.mjs';recordCompletion('.work/20-chrome/ci',JSON.parse(process.env.QUALIFICATION_PAIR),'success');"
      - name: Retain pair identity even when the test failed
        if: always()
        env:
          QUALIFICATION_PAIR: ${{ toJSON(matrix) }}
          QUALIFICATION_OUTCOME: ${{ steps.suite.outcome }}
        run: python3 driver/control/chrome/qualify.py pair --artifacts runtime/.work/20-chrome/ci --runtime-root runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-${{ matrix.build }}-${{ matrix.channel }}-${{ matrix.repeat }}
          path: runtime/.work/20-chrome/ci/
  qualification-publish:
    needs: [qualification-plan, qualification-pairs, qualification-combine, qualification-tests, delivery-attestation]
    if: always() && (needs.qualification-plan.result == 'failure' || needs.qualification-pairs.result != 'skipped')
    runs-on: ubuntu-24.04
    # Main keeps its one publisher group. Pull requests and branch runs get one
    # per ref, so a pull request's publish job never replaces main's pending one.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'chrome-qualification-publisher' || format('chrome-qualification-publisher-{0}', github.ref) }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qualification-*
          path: .work/qualification-results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualification-plan
          path: .work
      - name: Verify the held attestation and shipped baseline before appending
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ needs.qualification-tests.result }}
          VERIFIER_OUTCOME: ${{ needs.delivery-attestation.result }}
        run: |
          test "$TEST_OUTCOME" = success
          test "$VERIFIER_OUTCOME" = success
          mkdir -p .work
          python3 control/chrome/qualify.py prepare --artifacts .work/qualification-results --plan .work/qualification-plan.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        id: attest
        with:
          subject-path: .work/qualification-candidate.json
      - name: Verify the new attestation then push only the data branch
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: python3 control/chrome/qualify.py publish --bundle "$BUNDLE"
      # Pull-request mode, read only: the bundle list of the held record that
      # prepare extended, fetched with the job's token, so that the publish
      # step below holds no token. Nothing is written without a data branch.
      - name: Fetch the held record's attestations for the pull-request publish (read only)
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/chrome/qualify.py held-bundles --output .work/held-bundles.jsonl
      - name: Verify the new attestation then publish to a local bare remote (pull-request mode)
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          git init --quiet --bare .work/publish-remote.git
          git -C .work/publish-remote.git fetch --quiet "$PWD" refs/remotes/origin/main:refs/heads/main
          # With a data branch on origin, publish() takes its second-run path:
          # the held record is verified (from the read-only step's bundle list,
          # main's policy) and the candidate appended to it.
          if git rev-parse --verify --quiet refs/remotes/origin/chrome-qualification > /dev/null; then
            git -C .work/publish-remote.git fetch --quiet "$PWD" refs/remotes/origin/chrome-qualification:refs/heads/chrome-qualification
          fi
          python3 control/chrome/qualify.py publish --bundle "$BUNDLE" --remote .work/publish-remote.git --ref "$GITHUB_REF" --held-bundle .work/held-bundles.jsonl
          git -C .work/publish-remote.git show chrome-qualification:control/chrome/qualification.json > .work/published-record.json
          python3 -c "import json,sys;assert json.load(open(sys.argv[1]))==json.load(open(sys.argv[2])),'The local data branch does not hold the candidate'" .work/published-record.json .work/qualification-candidate.json
          test "$(git -C .work/publish-remote.git rev-parse refs/heads/main)" = "$(git rev-parse origin/main)"
          echo 'Pull-request mode: the verified candidate reached only the local bare remote'
      - name: Publish failure details and propose shipped-copy update
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_STATE: ${{ steps.publish.outcome }}
        run: python3 control/chrome/qualify.py notify
  delivery-attestation:
    if: github.repository == 'Ares-Empire/AresOS'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Make a nonempty synthetic record for real verifier tests
        run: |
          mkdir -p .work/attestation
          PYTHONPATH=control:control/chrome_tests python3 - <<'PY'
          import json, os
          from pathlib import Path
          from test_policy import entry
          # Unique bytes per run, so the attestation API lists this run's bundle alone.
          run = 'synthetic-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          Path('.work/attestation/record.json').write_text(json.dumps({'format':1,'entries':[entry(run=run), entry(version='158.0.1.0',channel='beta',run=run)]}))
          PY
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        id: attest
        with:
          subject-path: .work/attestation/record.json
      - name: Record this run's attestation API response with the job's token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Main fix H2: the product's anonymous verify() replays this response
          # offline; the token stays in this step. Until the fresh attestation
          # is listed the API answers 404 (or an empty list), so an attempt may
          # fail and the response decides (main fix F2).
          DIGEST=$(sha256sum .work/attestation/record.json | cut -d' ' -f1)
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$GITHUB_REPOSITORY/attestations/sha256:$DIGEST?per_page=100" > .work/attestation/api-response.json || true
            if python3 -c "import json,sys;d=json.loads(open(sys.argv[1]).read() or 'null');sys.exit(0 if isinstance(d,dict) and isinstance(d.get('attestations'),list) and d['attestations'] else 1)" .work/attestation/api-response.json 2> /dev/null; then exit 0; fi
            echo "attempt $attempt of 6: this run's attestation is not listed yet"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::The attestation API listed no attestation for this run's record after 6 attempts over 50 s (it answers 404 while none is listed)."
          exit 1
      - name: Retain this workflow's real Sigstore bundle and test altered copies
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" .work/attestation/bundle.json
          python3 control/chrome/ci/attestation.py .work/attestation/record.json .work/attestation/bundle.json .work/attestation/api-response.json --ref "$GITHUB_REF" 2>&1 | tee .work/attestation/verification.txt
          python3 control/chrome/ci/attestation.py control/chrome_tests/fixtures/qualification/42687597384/record.json control/chrome_tests/fixtures/qualification/42687597384/bundle.json control/chrome_tests/fixtures/qualification/42687597384/api-response.json --ref refs/heads/pkg/20-chrome-qual 2>&1 | tee .work/attestation/retained-fixture-verification.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/attestation/
