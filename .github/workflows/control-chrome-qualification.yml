name: Control Chrome qualification
on:
  push:
    branches: [pkg/20-chrome-qual, main]
    paths: ['control/**', 'reviews/20-chrome/QUALIFICATION*', '.github/workflows/control-chrome-qualification.yml']
  pull_request:
    branches: [pkg/20-chrome, main]
    paths: ['control/**', 'reviews/20-chrome/QUALIFICATION*', '.github/workflows/control-chrome-qualification.yml']
  workflow_dispatch:
  schedule:
    - cron: '19 4 * * *'
permissions:
  contents: read
concurrency:
  group: control-chrome-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Browser-free build, service, delivery and hermetic publisher tests
        run: |
          set -euo pipefail
          mkdir -p .work/20-chrome
          PYTHONPATH=control:control/chrome_tests python3 -m unittest test_build test_publisher test_qualification test_qualification_service -v 2>&1 | tee .work/20-chrome/qualification-tests.txt
          node --test control/chrome_tests/*.test.mjs 2>&1 | tee .work/20-chrome/node-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/20-chrome/*tests.txt
  qualification-plan:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 control/chrome/qualify.py plan > qualification-plan.json
          echo "matrix=$(cat qualification-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-plan
          path: qualification-plan.json
  qualification-pairs:
    needs: qualification-plan
    if: needs.qualification-plan.result == 'success' && needs.qualification-plan.outputs.matrix != '' && fromJSON(needs.qualification-plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualification-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.commit }}
          path: runtime
          persist-credentials: false
      - name: Check exact installed runtime identity
        env:
          EXPECTED_BUILD: ${{ matrix.build }}
        run: test "$(python3 runtime/control/chrome/build.py)" = "$EXPECTED_BUILD"
      - name: Build the requested channel in a disposable container
        env:
          CHANNEL: ${{ matrix.channel }}
          PACKAGE_URL: ${{ matrix.package_url }}
          PACKAGE_SHA256: ${{ matrix.package_sha256 }}
        run: |
          cp -R driver/control/chrome/ci/. runtime/control/chrome/ci/
          cp -R driver/control/chrome_tests/. runtime/control/chrome_tests/
          mkdir -p runtime/.github/workflows
          cp driver/.github/workflows/control-chrome-qualification.yml runtime/.github/workflows/
          tar -C runtime -cf - control docs/control/TOOLS.md .github/workflows/control-chrome-qualification.yml | docker build --build-arg CHANNEL="$CHANNEL" --build-arg PACKAGE_URL="$PACKAGE_URL" --build-arg PACKAGE_SHA256="$PACKAGE_SHA256" -t qualification -f runtime/control/chrome/ci/Dockerfile -
      - name: Run full receiver suite; repeat is a separate matrix job
        id: suite
        env:
          INSTALL_MODE: policy
          QUALIFICATION_VERSION: ${{ matrix.version }}
          QUALIFICATION_PAIR: ${{ toJSON(matrix) }}
          NODE_OPTIONS: --import=/workspace/control/chrome_tests/qualification-completion.mjs
        run: |
          mkdir -p .work/20-chrome/ci
          timeout --signal=TERM --kill-after=30s 85m docker run --rm --network none --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --shm-size=512m -e INSTALL_MODE -e QUALIFICATION_VERSION -e QUALIFICATION_PAIR -e NODE_OPTIONS -e GITHUB_RUN_ID -e GITHUB_SHA -v "$PWD/.work/20-chrome/ci:/out" qualification
      - name: Retain pair identity even when the test failed
        if: always()
        env:
          QUALIFICATION_PAIR: ${{ toJSON(matrix) }}
          QUALIFICATION_OUTCOME: ${{ steps.suite.outcome }}
        run: python3 driver/control/chrome/qualify.py pair --artifacts .work/20-chrome/ci --runtime-root runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-${{ matrix.build }}-${{ matrix.channel }}-${{ matrix.repeat }}
          path: .work/20-chrome/ci/
  qualification-publish:
    needs: [qualification-plan, qualification-pairs, qualification-tests, delivery-attestation]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.qualification-plan.result == 'failure' || needs.qualification-pairs.result != 'skipped')
    runs-on: ubuntu-24.04
    concurrency:
      group: chrome-qualification-publisher
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qualification-*
          path: .work/qualification-results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualification-plan
          path: .work
      - name: Verify the held attestation and shipped baseline before appending
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ needs.qualification-tests.result }}
          VERIFIER_OUTCOME: ${{ needs.delivery-attestation.result }}
        run: |
          test "$TEST_OUTCOME" = success
          test "$VERIFIER_OUTCOME" = success
          mkdir -p .work
          python3 control/chrome/qualify.py prepare --artifacts .work/qualification-results --plan .work/qualification-plan.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: .work/qualification-candidate.json
      - name: Verify the new attestation then push only the data branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/chrome/qualify.py publish
      - name: Publish failure details and propose shipped-copy update
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_STATE: ${{ steps.publish.outcome }}
        run: python3 control/chrome/qualify.py notify
  delivery-attestation:
    if: github.event_name != 'pull_request' && github.repository == 'Ares-Empire/AresOS'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Make a nonempty synthetic record for real verifier tests
        run: |
          mkdir -p .work/attestation
          PYTHONPATH=control:control/chrome_tests python3 - <<'PY'
          import json
          from pathlib import Path
          from test_policy import entry
          Path('.work/attestation/record.json').write_text(json.dumps({'format':1,'entries':[entry(), entry(version='158.0.1.0',channel='beta')]}))
          PY
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        id: attest
        with:
          subject-path: .work/attestation/record.json
      - name: Retain this workflow's real Sigstore bundle and test altered copies
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" .work/attestation/bundle.json
          python3 control/chrome/ci/attestation.py .work/attestation/record.json .work/attestation/bundle.json 2>&1 | tee .work/attestation/verification.txt
          GITHUB_HEAD_REF=pkg/20-chrome-qual python3 control/chrome/ci/attestation.py control/chrome_tests/fixtures/qualification/42687597384/record.json control/chrome_tests/fixtures/qualification/42687597384/bundle.json 2>&1 | tee .work/attestation/retained-fixture-verification.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/attestation/
