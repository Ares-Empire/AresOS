name: Control Chrome
on:
  push:
    branches: [pkg/20-chrome, pkg/20-chrome-adapters, pkg/20-chrome-qual, main]
    paths: ['control/**', 'docs/control/TOOLS.md', 'reviews/20-chrome/**', '.github/workflows/control-chrome.yml']
  pull_request:
    branches: [main]
    paths: ['control/**', 'docs/control/TOOLS.md', 'reviews/20-chrome/**', '.github/workflows/control-chrome.yml']
  workflow_dispatch:
  schedule:
    - cron: '19 4 * * *'
permissions:
  contents: read
concurrency:
  group: control-chrome-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        install: [external, policy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve the exact stable package and checksum
        id: package
        run: |
          python3 - <<'PY'
          import gzip,os,sys,urllib.request
          sys.path.insert(0,'control/chrome')
          from qualify import PACKAGES,packages
          with urllib.request.urlopen(PACKAGES,timeout=20) as response:
              package=packages(gzip.decompress(response.read()).decode())['stable']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for name in ['version','package_url','package_sha256']:
                  output.write(name+'='+package[name]+'\n')
          PY
      - name: Build disposable branded-Chrome container
        env:
          PACKAGE_URL: ${{ steps.package.outputs.package_url }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
        run: git archive HEAD control docs/control/TOOLS.md | docker build --build-arg PACKAGE_URL="$PACKAGE_URL" --build-arg PACKAGE_SHA256="$PACKAGE_SHA256" -t aresos-chrome-fixture -f control/chrome/ci/Dockerfile -
      - name: Browser fixtures only inside Linux container, sandbox on
        env:
          INSTALL_MODE: ${{ matrix.install }}
          QUALIFICATION_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .work/20-chrome/ci
          timeout --signal=TERM --kill-after=30s 85m docker run --rm --network none --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --shm-size=512m -e INSTALL_MODE -e QUALIFICATION_VERSION -e GITHUB_RUN_ID -e GITHUB_SHA -v "$PWD/.work/20-chrome/ci:/out" aresos-chrome-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-chrome-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.install }}
          path: .work/20-chrome/ci/
          retention-days: 14
