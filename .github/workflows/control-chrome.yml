name: Control Chrome
on:
  push:
    branches: [pkg/20-chrome, main]
    paths: ['control/**', 'docs/control/TOOLS.md', 'reviews/20-chrome/**', '.github/workflows/control-chrome.yml']
  pull_request:
    branches: [main]
    paths: ['control/**', 'docs/control/TOOLS.md', 'reviews/20-chrome/**', '.github/workflows/control-chrome.yml']
  workflow_dispatch:
  schedule:
    - cron: '19 4 * * *'
permissions:
  contents: read
concurrency:
  group: control-chrome-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        install: [external, policy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build disposable branded-Chrome container
        run: git archive HEAD control docs/control/TOOLS.md | docker build -t aresos-chrome-fixture -f control/chrome/ci/Dockerfile -
      - name: Browser fixtures only inside Linux container, sandbox on
        env:
          INSTALL_MODE: ${{ matrix.install }}
        run: |
          set -euo pipefail
          mkdir -p .work/20-chrome/ci
          docker run --rm --network none --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --shm-size=512m -e INSTALL_MODE -e GITHUB_RUN_ID -e GITHUB_SHA -v "$PWD/.work/20-chrome/ci:/out" aresos-chrome-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-chrome-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.install }}
          path: .work/20-chrome/ci/
          retention-days: 14

  qualification-plan:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 control/chrome/qualify.py plan > .work-qualification-matrix.json
          echo "matrix=$(cat .work-qualification-matrix.json)" >> "$GITHUB_OUTPUT"
  qualification-pairs:
    needs: qualification-plan
    if: needs.qualification-plan.result == 'success' && needs.qualification-plan.outputs.matrix != '' && fromJSON(needs.qualification-plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualification-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.commit }}
          path: runtime
          persist-credentials: false
      - name: Check exact installed runtime identity
        env:
          EXPECTED_BUILD: ${{ matrix.build }}
        run: test "$(python3 runtime/control/chrome/build.py)" = "$EXPECTED_BUILD"
      - name: Build the requested channel in a disposable container
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          cp -R driver/control/chrome/ci/. runtime/control/chrome/ci/
          cp -R driver/control/chrome_tests/. runtime/control/chrome_tests/
          tar -C runtime -cf - control docs/control/TOOLS.md | docker build --build-arg CHANNEL="$CHANNEL" -t qualification -f runtime/control/chrome/ci/Dockerfile -
      - name: Run full receiver suite; repeat is a separate matrix job
        env:
          INSTALL_MODE: policy
          QUALIFICATION_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p .work/20-chrome/ci
          docker run --rm --network none --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --shm-size=512m -e INSTALL_MODE -e QUALIFICATION_VERSION -e GITHUB_RUN_ID -e GITHUB_SHA -v "$PWD/.work/20-chrome/ci:/out" qualification
      - name: Retain pair identity even when the test failed
        if: always()
        env:
          QUALIFICATION_PAIR: ${{ toJSON(matrix) }}
        run: python3 driver/control/chrome/qualify.py pair --artifacts .work/20-chrome/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-${{ matrix.build }}-${{ matrix.channel }}-${{ matrix.repeat }}
          path: .work/20-chrome/ci/
  qualification-publish:
    needs: [qualification-plan, qualification-pairs]
    if: always() && github.ref == 'refs/heads/main' && needs.qualification-plan.result == 'success' && needs.qualification-pairs.result != 'skipped'
    runs-on: ubuntu-24.04
    concurrency:
      group: chrome-qualification-publisher
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qualification-*
          path: .work/qualification-results
      - name: Verify the held attestation and shipped baseline before appending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .work
          python3 control/chrome/qualify.py prepare --artifacts .work/qualification-results
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: .work/qualification-candidate.json
      - name: Verify the new attestation then push only the data branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/chrome/qualify.py publish
      - name: Publish failure details and propose shipped-copy update
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_STATE: ${{ steps.publish.outcome }}
        run: python3 control/chrome/qualify.py notify
  delivery-attestation:
    if: github.event_name == 'push' && github.repository == 'Ares-Empire/AresOS'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Make a synthetic record for real verifier tests
        run: |
          mkdir -p .work
          cp control/chrome/qualification.json .work/delivery-fixture.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: .work/delivery-fixture.json
      - name: Verify this run, then refuse altered bytes and a different source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/chrome/ci/attestation.py .work/delivery-fixture.json
