name: Control Mail
on:
  pull_request:
    branches: [main, pkg/19-mail]
    paths: ['control/**', 'docs/control/TOOLS.md', 'reviews/19-mail/**', '.github/workflows/control-mail.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-mail-${{ github.ref }}
  cancel-in-progress: true
jobs:
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Real isolated mail servers and shared base (no model or real account)
        run: bash control/ci/mail/run.sh suite
      - name: Upload exact output (no credentials or private keys)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-mail-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/mail-ci/base.txt
            .work/mail-ci/mail.txt
            .work/mail-ci/isolation.txt
            .work/mail-ci/greenmail.txt
            .work/mail-ci/dovecot.txt
  sweep:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: OS and SQLite fault sweep in isolated mail containers
        env:
          MAIL_SWEEP_SHARD: ${{ matrix.shard }}
          MAIL_SWEEP_SHARDS: 4
        run: bash control/ci/mail/run.sh sweep
      - name: Upload sweep output and fixture isolation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-mail-sweep-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/mail-ci/setup.txt
            .work/mail-ci/mail.txt
            .work/mail-ci/isolation.txt
            .work/mail-ci/greenmail.txt
            .work/mail-ci/dovecot.txt
