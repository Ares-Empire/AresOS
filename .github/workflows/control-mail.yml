name: Control Mail
on:
  push:
    branches: [pkg/19-mail]
    paths: ['control/**', 'docs/control/TOOLS.md', 'reviews/19-mail/**', '.github/workflows/control-mail.yml']
  pull_request:
    branches: [main]
    paths: ['control/**', 'docs/control/TOOLS.md', 'reviews/19-mail/**', '.github/workflows/control-mail.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-mail-${{ github.ref }}
  cancel-in-progress: false
jobs:
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Real isolated mail servers and shared base (no model or real account)
        run: bash control/ci/mail/run.sh
      - name: Upload exact output (no credentials or private keys)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-mail-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/mail-ci/base.txt
            .work/mail-ci/mail.txt
            .work/mail-ci/greenmail.txt
            .work/mail-ci/dovecot.txt
