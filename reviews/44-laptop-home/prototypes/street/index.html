<!doctype html>
<!-- Development aid for AresOS package 44 (the laptop-screen home, a design study). Not product code.
     Direction "Night street": the town seen from the side, at night. Open this file in a browser; it needs
     only the files in ../shared. Options: see ../shared/home.js. Also ?ledges=1 draws where companions can stand,
     ?sprite=1 lets one companion-sized figure walk (a measuring aid), and ?look=day shows the same town at the
     world's noon instead of at night, on one grid and on terraces (the day rules are the last block of the style
     sheet below). ?look=day&ground=plain is the day's other ground, one lawn, kept for comparison. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night street · AresOS laptop home (prototype)</title>
<link rel="stylesheet" href="../shared/home.css">
<style>
  /* What a look sets. Night is the default; ?look=day (the class "day" on the page) sets them again below. */
  :root { --idle: brightness(0.62) saturate(0.82); --sign-name: var(--ink-2); --sign-short: #9c7c40; --hidden: 0.13; }
  .stage::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(900px 520px at 4% 100%, rgba(201, 55, 44, 0.10), transparent 70%),
                radial-gradient(1000px 560px at 100% 0%, rgba(93, 134, 179, 0.11), transparent 70%); }
  .star { position: absolute; width: 2px; height: 2px; background: var(--ink); }
  #clock { position: absolute; left: 64px; top: 40px; }
  #battery { position: absolute; right: 64px; top: 48px; }

  .street { position: absolute; left: 0; width: 1920px; }
  .view { position: absolute; inset: 0; }
  .slide { position: absolute; inset: 0; transition: transform .3s ease-out; }
  .street-sign { position: absolute; left: 860px; width: 200px; text-align: center; cursor: default; }
  .street-sign b { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--g); }
  .street-sign span { display: block; margin-top: 5px; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .road { position: absolute; bottom: 0; height: 16px; background-color: #18181c;
    border-top: 3px solid color-mix(in srgb, var(--b) 62%, var(--wall));
    background-image: repeating-linear-gradient(90deg, transparent 0 calc(var(--cell) * 2 - 1px), var(--wall) 0 calc(var(--cell) * 2)); }

  .house { position: absolute; bottom: 16px; cursor: pointer; transition: opacity .15s; }
  .house canvas { position: absolute; left: 0; bottom: 0; filter: var(--idle); transition: filter .15s; }
  .house:hover canvas, .house.is-running canvas, .house.is-selected canvas, .house.is-match canvas, .house.is-opening canvas,
  .bright .house canvas { filter: none; }
  .house-sign { position: absolute; left: 50%; width: calc(var(--pitch) - 6px); transform: translateX(-50%); text-align: center; }
  .house-sign b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    font-weight: 500; font-size: var(--name); line-height: 1.1; color: var(--sign-name); overflow-wrap: anywhere; }
  .house-sign span { display: block; margin-top: 1px; font-family: var(--mono); font-size: 12px; color: var(--sign-short); }
  .house:hover b, .house.is-running b, .house.is-selected b, .house.is-match b { color: var(--ink); }
  .house:hover span, .house.is-running span, .house.is-selected span, .house.is-match span { color: var(--gold-hi); }
  .house.is-dim { opacity: var(--hidden); }
  .mat { position: absolute; bottom: -3px; height: 3px; background: var(--g); }
  .door { position: absolute; bottom: 0; }
  /* A house is lit while its app runs. */
  .house.is-running .door { background: linear-gradient(#ffe7a6, #e9b04a 55%, #b9791e); box-shadow: 0 0 22px 5px rgba(237, 202, 119, 0.42); }
  .house.is-running .mat { background: var(--gold-hi); box-shadow: 0 0 14px 2px rgba(237, 202, 119, 0.5); }
  /* Walking in: the world's purple puff. */
  .house.is-opening .door { background: #b66bff; box-shadow: 0 0 26px 8px rgba(182, 107, 255, 0.55); }
  .frame { position: absolute; left: -7px; bottom: -7px; border: 2px solid var(--gold); border-radius: 5px; opacity: 0; }
  .house.is-best .frame, .house.is-selected .frame { opacity: 1; }
  .puff { position: absolute; width: 5px; height: 5px; background: #c58bff; animation: puff .6s ease-out forwards; }
  @keyframes puff { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

  .pad { position: absolute; left: 0; right: 0; top: 948px; height: 1px; background: var(--line); }
  .pad i { position: absolute; left: 953px; top: -7px; width: 14px; height: 14px; background: linear-gradient(135deg, var(--gold-hi), var(--gold) 55%, #8c6a2c); }
  #hotbar { position: absolute; left: 50%; top: 966px; transform: translateX(-50%); }
  #finder { position: absolute; left: 50px; bottom: 30px; width: 480px; z-index: 40; }
  .hint { position: absolute; right: 64px; bottom: 44px; }
  /* The ends of a street longer than the screen: how many houses are out of sight there; a click slides to them. */
  .street-end { position: absolute; z-index: 6; min-width: 46px; height: 32px; padding: 0 10px; border-radius: 6px; cursor: pointer;
    display: grid; place-items: center; font-family: var(--mono); font-size: 14px; color: var(--g);
    background: #0a0a0cf0; border: 1px solid color-mix(in srgb, var(--g) 45%, transparent); }
  .street-end:hover { border-color: var(--g); }
  .end-L { left: 10px; } .end-R { right: 10px; }
  .street-end[hidden], .street-fade[hidden] { display: none; }
  .street-fade { position: absolute; z-index: 5; top: 0; bottom: 0; width: 120px; pointer-events: none; }
  .fade-L { left: 0; background: linear-gradient(90deg, var(--wall) 15%, transparent); }
  .fade-R { right: 0; background: linear-gradient(270deg, var(--wall) 15%, transparent); }
  .sprites { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 35; pointer-events: none; }
  .ledge { position: absolute; height: 0; border-top: 2px dashed var(--gold-hi); z-index: 30; pointer-events: none; }
  .ledge-note { position: absolute; left: 0; right: 0; top: 52px; text-align: center; font-size: 15px; color: var(--gold-hi); z-index: 30; }

  /* ---- ?look=day: the same town at the world's noon (HUB.md 2.1: flat grass, a clear sky, it never gets dark).
     Flat colours only, no game texture. Nothing here moves or repeats: no clouds, no sun, and the night's stars
     and their one timer are not made at all (see the script).
     The day stands on one grid (`grid` in the script): every street has the same columns, every road runs from
     edge to edge of the screen, and every column has its plot, with a house on it or free.
     The ground is terraces: each street is one step of a hillside. The sky ends at the top step's far edge, and
     every lower street has the bank of the step above behind it. The script paints them as one still background.
     &ground=plain is the other ground that was drawn: one lawn under a sky that ends above the first street. ---- */
  .day { --sky: #6f9df0; --sky-low: #aecbf8; --turf: #8ab254; --bank-edge: #36502a; --bank-top: #44642e; --bank: #5f8442;
    --paving: #2b2832; --plot: #b9c7a2; --lawn-far: #7fa650; --lawn: #4f7234;
    --plate: rgba(13, 13, 16, 0.5); --plate-lit: rgba(13, 13, 16, 0.88);
    /* By day a house that is not open is sun-bleached: paler and a little duller, with half its colour. Open, it has all of it. */
    --idle: saturate(0.45) contrast(0.8) brightness(0.93); --sign-name: #dedcd4; --sign-short: #c3a364; --hidden: 0.16; }
  .day .stage::before { display: none; }
  /* Text that stands on the sky or the grass is white with a hard shadow, as the game writes over its world. */
  .day .clock-time { text-shadow: 3px 3px 0 rgba(13, 13, 16, 0.42); }
  .day .clock-date, .day .battery, .day .hint, .day .slot-key, .day .ledge-note { color: #fff; text-shadow: 1px 1px 0 rgba(13, 13, 16, 0.62); }
  .day .battery-shell { border-color: #fff; box-shadow: 1px 1px 0 rgba(13, 13, 16, 0.5); }
  .day .battery-shell::after, .day .battery-shell i { background: #fff; }
  /* The names hang on dark plates, as the world's do (HubLayout.NAME_BACKGROUND): white and gold need them by day. */
  .day .street-sign { left: 50%; width: max-content; transform: translateX(-50%); padding: 6px 12px 7px; border-radius: 3px; background: rgba(13, 13, 16, 0.76); }
  .day .street-sign span { color: #c9c6bd; }
  .day .house-sign { width: max-content; max-width: calc(var(--pitch) - 6px); padding: 0 6px 2px; border-radius: 3px;
    background: var(--plate); transition: background .15s; }
  .day .house:hover .house-sign, .day .house.is-running .house-sign, .day .house.is-selected .house-sign,
  .day .house.is-match .house-sign { background: var(--plate-lit); }
  /* The road as in the world: dark paving with the group's colour as a line down its middle. It runs from edge to
     edge of the screen and stands still when its street slides. Its joints are two blocks apart, on the grid. */
  .day .road { left: 0; width: 1920px; border-top: 0; background-color: var(--paving);
    background-image: linear-gradient(transparent 6px, var(--b) 6px 10px, transparent 10px),
      repeating-linear-gradient(90deg, transparent 0 calc(var(--cell) * 2 - 1px), rgba(0, 0, 0, 0.4) 0 calc(var(--cell) * 2));
    background-position: 0 0, var(--joint) 0; }
  /* A plot: the pale stone a house stands on, half a block wider than the house on each side and as deep, drawn
     lying on the ground. Every column has one, so a free place is a free plot and all streets are equally long. */
  .day .plots { position: absolute; bottom: 16px; height: var(--depth); transform-origin: 0 100%; transform: skewX(-45deg);
    background: repeating-linear-gradient(90deg, var(--plot) 0 var(--plot-w), transparent var(--plot-w) var(--pitch)); }
  /* The doormat reaches from the door to the road's line. */
  .day .mat { bottom: -6px; height: 6px; }
  /* Open by day: no glow reads in sunlight. The door is gold in a dark frame, the gold mat lies across the whole
     road (gold on the dark paving is the strongest light a day has), and the sign has the hotbar's gold mark. */
  .day .house.is-running .door { box-shadow: 0 0 0 2px #131419; }
  .day .house.is-running .mat { bottom: -16px; height: 16px; box-shadow: 0 0 0 1px rgba(13, 13, 16, 0.55); }
  .day .house.is-running .house-sign { padding-bottom: 4px; box-shadow: inset 0 -2px 0 var(--gold-hi); }
  .day .house.is-opening .door { box-shadow: 0 0 0 2px #131419, 0 0 22px 6px rgba(182, 107, 255, 0.6); }
  .day .frame { border: 3px solid var(--gold-hi); box-shadow: 0 0 0 2px rgba(13, 13, 16, 0.82), inset 0 0 0 1px rgba(13, 13, 16, 0.5); }
  /* Home: the dark stone pad with its gold block. */
  .day .pad { background: none; }
  .day .pad::before { content: ''; position: absolute; left: 912px; top: -9px; width: 96px; height: 18px; background: var(--paving); }
  /* The typing line is the chat's dark bar, also at rest. */
  .day .finder-line { background: rgba(13, 13, 16, 0.6); }
  .day .finder-hint { color: #d6d3ca; }
  /* At an end of a long street that runs off the screen the houses themselves fade out; the road and the ground
     behind them stay whole. (The night lays a fade to its wall over them instead.) */
  .day .street-fade { display: none; }
  .day .view.cut-L, .day .view.cut-R {
    -webkit-mask-image: linear-gradient(90deg, var(--cut-l, #000) 18px, #000 120px, #000 1800px, var(--cut-r, #000) 1902px);
    mask-image: linear-gradient(90deg, var(--cut-l, #000) 18px, #000 120px, #000 1800px, var(--cut-r, #000) 1902px); }
  .day .view.cut-L { --cut-l: transparent; }
  .day .view.cut-R { --cut-r: transparent; }
  /* &ground=plain: the plots are paler lawn, and the avenue runs down the middle from the first street to home. */
  .day.plain { --plot: rgba(255, 255, 255, 0.3); }
  .avenue { position: absolute; background: var(--paving); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="clock"></div>
  <div id="battery"></div>
  <div id="town"></div>
  <div class="pad"><i></i></div>
  <div id="hotbar"></div>
  <div id="finder"></div>
  <div class="hint label">Click opens &nbsp;·&nbsp; 1 to 9 the hotbar &nbsp;·&nbsp; type to find</div>
</div>
<script src="../shared/home.js"></script>
<script>
'use strict';
(() => {
  const stage = document.getElementById('stage'), townEl = document.getElementById('town');
  // ?look=day: the same town at the world's noon. Its classes on the page; the style sheet does the rest.
  // The day has two grounds: terraces (the one chosen) and, with &ground=plain, one lawn (kept for comparison).
  const day = Home.params.get('look') === 'day';
  const ground = !day ? null : Home.params.get('ground') === 'plain' ? 'plain' : 'terraces';
  // A street's strip is 196 high at night. By day it is 202, so that a sign with a name of two lines over the
  // largest house ends under the road above it and never lies on that road. The lowest road is at the same height.
  const TOP = day ? 126 : 150, STREET = day ? 202 : 196, ROAD = 16, EDGE = 40, FLOOR = 948, MID = 960, WIDTH = 1920;
  document.documentElement.classList.toggle('day', day);
  if (day) document.documentElement.classList.add(ground);

  /** The grid a look's houses stand on, from the farthest slot used on any side of any street: the block size (as
   *  large as fits, 7 to 10 pixels), the step from one house to the next, and the free middle of a street.
   *  - Night: as the study first drew it, a step of 14.6 blocks and a middle of 200 pixels.
   *  - Day: whole blocks only, counted from the middle of the screen. A house is 12 blocks wide, 2 blocks are free
   *    between two houses (a step of 14), and the middle is as wide as two houses with the free blocks around
   *    them (30). So the columns of all four streets are one lattice across the screen, the middle is two of its
   *    columns, and a street that slides by whole steps stays on it. `cols` is how many columns a side are in
   *    view: 5, 6, 7 or 8. */
  const grid = day
    ? slots => { const cell = Math.max(7, Math.min(10, Math.floor((MID - EDGE) / (14 * slots + 13))));
        return { cell, pitch: 14 * cell, gap: 30 * cell, cols: Math.floor(((MID - EDGE) / cell - 13) / 14) }; }
    : slots => { const cell = Math.max(7, Math.min(10, Math.floor((MID - 100 - EDGE) / (slots * 14.6))));
        return { cell, pitch: Math.round(cell * 14.6), gap: 200, cols: 0 }; };

  /** Index of a place in HUB.md 3.3's order (N0L0 0, N0R0 1, N1L0 2, N1R0 3, N1L1 4 ...). */
  const order = p => p.row * (p.row + 1) + 2 * p.k + (p.side === 'R' ? 1 : 0);

  /** Where every house stands, from its place in the world and never from a running count, so a free place moves
   *  nothing else. The side is the place's L or R. The slot is that side's rank of the place in HUB.md 3.3's order:
   *  row r holds r + 1 places a side, so slot = r(r+1)/2 + k (N0L0 0, N1L0 1, N1L1 2, N2L0 3 ...). A free place
   *  stays a gap, as in the world. An app without a place yet takes the next places after the farthest one its
   *  group uses, until the mod gives it one. One block size for the whole town, from the farthest slot used on
   *  any side (`grid` above). */
  function layout(apps) {
    const spots = new Map();
    let farthest = 0;
    Home.GROUPS.forEach(g => {
      const list = apps.filter(a => a.group === g.key);
      let next = Math.max(-1, ...list.filter(a => a.place).map(a => order(a.place))) + 1;
      for (const app of list) {
        const p = app.place || Home.place(g.letter, next++);
        const slot = p.row * (p.row + 1) / 2 + p.k;
        spots.set(app.id, { group: g.key, side: p.side, slot });
        farthest = Math.max(farthest, slot + 1);
      }
    });
    const { cell, pitch, gap, cols } = grid(Math.max(farthest, 1)), size = 12 * cell;
    for (const spot of spots.values())
      spot.x = spot.side === 'L' ? MID - gap / 2 - spot.slot * pitch - size : MID + gap / 2 + spot.slot * pitch;
    return { spots, cell, size, pitch, gap, cols, depth: Math.round(cell * 0.9) };
  }

  const town = layout(Home.town.apps);
  const { cell, size, depth, pitch, gap, cols } = town;
  /** By day a street slides by whole steps only, as far as shows what was asked for, so it stays on the grid. */
  const snap = day ? offset => Math.sign(offset) * Math.ceil(Math.abs(offset) / pitch) * pitch : offset => offset;
  const G = Home.GROUPS.map((g, gi) => TOP + (gi + 1) * STREET - ROAD);   // each street's ground line: its houses' feet
  const surfaces = [], occluders = [], streets = [];

  // A few stars, at night only. At rest nothing on this screen moves, so nothing is drawn again: one star changes
  // its brightness every few seconds, in one step, and that is all the motion there is. The day has no stars and
  // no timer of its own: at rest only the clock changes.
  if (!day) {
    let seed = 44;
    const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const stars = [];
    for (let i = 0; i < 90; i++) {
      const star = document.createElement('i');
      star.className = 'star';
      star.style.cssText = `left:${Math.round(random() * 1916)}px;top:${Math.round(random() * 900)}px;opacity:${(0.1 + random() * 0.35).toFixed(2)}`;
      stage.prepend(star);
      stars.push(star);
    }
    if (!Home.still) setInterval(() => {
      if (!document.hidden) stars[Math.floor(Math.random() * stars.length)].style.opacity = (0.08 + Math.random() * 0.4).toFixed(2);
    }, 4000);
  }

  // The day's ground: one still background behind the town, in flat colours.
  // - Terraces: the sky ends at the far edge of the top street's step. Each step is a band of sunlit turf that the
  //   road lies on (TREAD behind the houses' feet, LIP in front of the road), and under it the bank down to the
  //   next step, a little darker under the edge. All four steps are alike.
  // - Plain: the sky ends at HORIZON, above the first street; below it is one lawn, and the avenue runs down its
  //   middle from the first street to home.
  const TREAD = 14, LIP = 4, HORIZON = 140;
  if (ground === 'terraces') {
    const bands = ['var(--sky) 0', `var(--sky-low) ${G[0] - TREAD}px`];
    G.forEach((g, gi) => bands.push(`var(--turf) ${g - TREAD}px`, `var(--turf) ${g + ROAD + LIP}px`,
      `var(--bank-edge) ${g + ROAD + LIP}px`, `var(--bank-edge) ${g + ROAD + LIP + 2}px`,
      `var(--bank-top) ${g + ROAD + LIP + 2}px`, `var(--bank) ${gi < 3 ? G[gi + 1] - TREAD : 1080}px`));
    stage.style.background = `linear-gradient(${bands.join(', ')})`;
  }
  if (ground === 'plain') {
    stage.style.background = `linear-gradient(var(--sky) 0, var(--sky-low) ${HORIZON}px, var(--lawn-far) ${HORIZON}px, var(--lawn) 1080px)`;
    const avenue = document.createElement('div');
    avenue.className = 'avenue';
    avenue.style.cssText = `left:${MID - 2 * cell}px;width:${4 * cell}px;top:${G[0]}px;height:${FLOOR - G[0]}px`;
    townEl.append(avenue);
  }

  Home.GROUPS.forEach((g, gi) => {
    const list = Home.town.apps.filter(a => a.group === g.key), base = G[gi];
    const margin = Math.floor(cell / 2);   // how far a plot reaches past its house on each side
    const street = document.createElement('div');
    street.className = 'street';
    street.style.cssText = `top:${TOP + gi * STREET}px;height:${STREET}px;--g:${g.colour};--b:${g.block};--cell:${cell}px;--pitch:${pitch}px;--depth:${depth}px;--plot-w:${size + 2 * margin}px;--joint:${(MID - gap / 2) % (2 * cell)}px;--name:${cell >= 9 ? 14 : 13}px`;
    // Everything of the street that slides when it is longer than the screen (more than 16 apps in its group),
    // inside the part of the screen it is seen through.
    const view = document.createElement('div'), slide = document.createElement('div');
    view.className = 'view';
    slide.className = 'slide';
    view.append(slide);
    // As in the world, the group's name hangs over the road between its two front logos (HUB.md 2.6). A click on
    // it brings a street that was slid by hand back to the middle.
    const sign = document.createElement('div');
    sign.className = 'street-sign';
    sign.style.bottom = ROAD + Math.round(size * 0.42) + 'px';
    sign.innerHTML = `<b>${g.title.replace('&', '&amp;')}</b><span>${g.where} · ${list.length}</span>`;
    const spots = list.map(a => town.spots.get(a.id));
    const far = side => Math.max(-1, ...spots.filter(s => s.side === side).map(s => s.slot));
    const road = document.createElement('div');
    road.className = 'road';
    let x1 = 0, x2 = WIDTH;
    if (day) {
      // By day every road is the same: from edge to edge of the screen, standing still (it goes into the street
      // under the houses, below). What slides is the plots: one for every column of the grid on each side, and
      // for every column past the grid that this street uses.
      for (const side of ['L', 'R']) {
        const n = Math.max(cols, far(side) + 1), plots = document.createElement('div');
        plots.className = `plots plots-${side}`;
        plots.dataset.n = n;
        const first = side === 'L' ? MID - gap / 2 - (n - 1) * pitch - size : MID + gap / 2;
        plots.style.cssText = `left:${first - margin}px;width:${(n - 1) * pitch + size + 2 * margin}px`;
        slide.append(plots);
      }
      slide.append(sign);
    } else {
      // At night the road is paved from the farthest house on the left to the farthest on the right, free places
      // included, and slides with its houses.
      x1 = far('L') < 0 ? MID - gap / 2 : MID - gap / 2 - far('L') * pitch - size - 2 * cell;
      x2 = far('R') < 0 ? MID + gap / 2 : MID + gap / 2 + far('R') * pitch + size + 2 * cell;
      road.style.cssText = `left:${x1}px;width:${x2 - x1}px`;
      slide.append(sign, road);
    }
    surfaces.push({ street: gi, still: day, id: `street:${g.key}`, ownerId: 'town', kind: 'edge', x1, x2, y: base, weight: 2 });

    list.forEach(app => {
      const x = town.spots.get(app.id).x;
      const house = document.createElement('div');
      house.className = 'house';
      house.dataset.app = app.id;
      house.style.cssText = `left:${x}px;width:${size}px;height:${size + depth + 40}px`;
      // The sign stands on the roof and grows upward: a long name takes a second line, as the world's signs do.
      const label = document.createElement('div');
      label.className = 'house-sign';
      label.style.cssText = `bottom:${size + depth + 3}px`;
      const name = document.createElement('b'), short = document.createElement('span');
      name.textContent = app.name;
      short.textContent = '/' + app.short;
      label.append(name, short);
      const door = document.createElement('div'), mat = document.createElement('div'), frame = document.createElement('div');
      door.className = 'door'; mat.className = 'mat'; frame.className = 'frame';
      door.style.cssText = `left:${5 * cell}px;width:${2 * cell}px;height:${3 * cell}px`;
      mat.style.cssText = `left:${5 * cell}px;width:${2 * cell}px`;
      frame.style.cssText = `width:${size + 14}px;height:${size + 14}px`;
      house.append(label, Home.logoCanvas(app, cell, depth), door, mat, frame);
      slide.append(house);

      // What the companions' runtime would be told: the roof as a ledge, the house as a box.
      const top = app.cells[11].map((c, u) => c ? u : -1).filter(u => u >= 0);
      if (top.length) surfaces.push({ street: gi, id: `roof:${app.id}`, ownerId: `house:${app.id}`, kind: 'edge',
        x1: x + top[0] * cell, x2: x + (top[top.length - 1] + 1) * cell, y: base - size, room: STREET - ROAD - size });
      occluders.push({ street: gi, id: `house:${app.id}`, z: 1, l: x, t: base - size, r: x + size, b: base });
    });

    // Past 16 apps in a group the street is longer than the screen. At rest it stands in the middle like the
    // others, and each end that runs off the screen gets a sign with the number of houses out of sight there.
    const xs = spots.map(s => s.x), least = Math.min(...xs, MID), most = Math.max(...xs.map(x => x + size), MID);
    const range = [snap(Math.min(0, WIDTH - EDGE - most)), snap(Math.max(0, EDGE - least))];
    const ends = ['L', 'R'].map(side => {
      const end = document.createElement('div');
      end.className = `street-end end-${side}`;
      end.style.bottom = ROAD + Math.round(size / 2) - 16 + 'px';
      const fade = document.createElement('div');
      fade.className = `street-fade fade-${side}`;
      street.append(fade, end);
      return { side, end, fade };
    });
    const st = { el: street, slide, range, offset: 0, byHand: false, list, gi };
    st.set = offset => {
      st.offset = Math.max(range[0], Math.min(range[1], Math.round(offset)));
      slide.style.transform = st.offset ? `translateX(${st.offset}px)` : '';
      for (const { side, end, fade } of ends) {
        const out = list.filter(a => { const x = town.spots.get(a.id).x + st.offset; return side === 'L' ? x < EDGE / 2 : x + size > WIDTH - EDGE / 2; }).length;
        end.textContent = side === 'L' ? `‹ ${out}` : `${out} ›`;
        end.hidden = fade.hidden = !out;
        view.classList.toggle(`cut-${side}`, out > 0);   // by day the houses fade out there, and the road stays whole
      }
    };
    // A click on an end slides the street until its last house on that side is in view.
    ends.forEach(({ side, end }) => end.addEventListener('click', e => {
      e.stopPropagation();
      st.byHand = true;
      st.set(side === 'L' ? range[1] : range[0]);
    }));
    sign.addEventListener('click', () => { st.byHand = false; st.set(0); });
    street.prepend(view);
    if (day) street.prepend(road);   // under the houses and their doormats
    st.set(0);
    streets.push(st);
    townEl.append(street);
  });

  /** The gold frame (the best hit while he types, or the arrow keys' choice) is always in view: its street slides
   *  as little as shows the whole house. A street without the frame goes back to the middle, unless he slid it by
   *  hand; that lasts until Escape, a click on the group's name, or the laptop home losing the keyboard. */
  function follow() {
    const target = (Home.state.selected && Home.state.selected.closest('.house'))
      || (Home.state.best && townEl.querySelector(`.house[data-app="${Home.state.best}"]`));
    for (const st of streets) {
      if (target && st.el.contains(target)) {
        const x = town.spots.get(target.dataset.app).x;
        const shown = Math.min(Math.max(st.offset, EDGE - x), WIDTH - EDGE - size - x);
        st.set(snap(shown));
      } else if (!st.byHand) st.set(0);
    }
  }
  Home.on('refresh', follow);
  const middle = () => streets.forEach(st => { st.byHand = false; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') middle(); }, true);
  if (!Home.still) addEventListener('blur', () => { middle(); follow(); });

  Home.on('opening', app => {
    const house = townEl.querySelector(`[data-app="${app.id}"]`);
    if (!house) return;
    for (let i = 0; i < 9; i++) {
      const p = document.createElement('i');
      p.className = 'puff';
      p.style.cssText = `left:${5.5 * cell + (Math.random() - 0.5) * 2 * cell}px;bottom:${cell + Math.random() * 2 * cell}px;--dx:${(Math.random() - 0.5) * 70}px;--dy:${-30 - Math.random() * 60}px`;
      house.append(p);
      setTimeout(() => p.remove(), 650);
    }
  });

  // The same shape as a world snapshot of the companions' runtime (its README, "World provider"): the streets
  // and roofs are ledges, the houses are boxes, the line over the hotbar is the floor. A slid street moves its
  // ledges and boxes with it; the runtime reads a snapshot every frame, so companions on it ride along.
  const moved = s => { const d = s.still ? 0 : streets[s.street].offset, { street, still, ...rest } = s;
    return 'x1' in s ? { ...rest, x1: s.x1 + d, x2: s.x2 + d } : { ...rest, l: s.l + d, r: s.r + d }; };
  window.laptopHome = { world: { snapshot: () => ({ viewport: { width: 1920, height: 1080, dpr: devicePixelRatio || 1 },
    surfaces: surfaces.map(moved), occluders: occluders.map(moved), floor: { x1: 0, x2: 1920, y: FLOOR, weight: 1.2 } }) },
    // For tools/webkit-shot.py's street check: with the removed apps (?hole=) put back, every other house has the
    // same side and slot, and every house stands where the layout says.
    test: { holeMovesNothing: () => {
      const whole = layout([...Home.town.apps, ...Home.town.removed]);
      return Home.town.removed.length > 0 && Home.town.apps.every(a => {
        const now = town.spots.get(a.id), before = whole.spots.get(a.id);
        const el = townEl.querySelector(`.house[data-app="${a.id}"]`);
        return now.side === before.side && now.slot === before.slot && parseFloat(el.style.left) === now.x;
      });
    } } };
  if (Home.params.has('ledges')) {
    const world = window.laptopHome.world.snapshot();
    for (const s of [...world.surfaces, { ...world.floor }]) {
      const line = document.createElement('i');
      line.className = 'ledge';
      line.style.cssText = `left:${s.x1}px;width:${s.x2 - s.x1}px;top:${s.y - 1}px`;
      stage.append(line);
    }
    const note = document.createElement('div');
    note.className = 'ledge-note';
    note.textContent = `Where companions can stand later: ${world.surfaces.length} ledges (4 streets and the roofs) and the floor.`;
    stage.append(note);
  }

  // ?sprite=1, a measuring aid (review 1, finding 7): one figure the size of a companion (16 x 16 art pixels at
  // the runtime's size 5, so 80 x 80) walks along the Games street, on a see-through canvas over the whole town
  // that is cleared and drawn again every frame, as the companions' runtime draws on the canvas its host gives it.
  // The figure is a plain one made here, not a companion's art. ?sprite=small draws it on a canvas of its own size
  // that is moved instead; &fps=N draws at most N frames a second (the runtime lets its host give the clock).
  if (Home.params.has('sprite')) {
    const FIGURE = ['.....######.....', '....########....', '...##########...', '...##.####.##...', '...##########...',
      '....########....', '.....######.....', '...##########...', '..############..', '..############..', '..############..',
      '...##########...', '....########....', '....##....##....', '....##....##....', '...###....###...'];
    const STEP = ['....##....##....', '.....##..##.....', '....###...###...'];
    const small = Home.params.get('sprite') === 'small', every = 1000 / (Number(Home.params.get('fps')) || 1000);
    const scale = devicePixelRatio || 1, canvas = document.createElement('canvas');
    const W = small ? 80 : 1920, H = small ? 80 : 1080;
    canvas.className = 'sprites';
    canvas.width = Math.round(W * scale); canvas.height = Math.round(H * scale);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    stage.append(canvas);
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    const S = 5, y = TOP + 2 * STREET - ROAD - 16 * S;
    let x = 400, dir = 1, last = performance.now(), drawn = 0;
    const frame = now => {
      requestAnimationFrame(frame);
      if (now - drawn < every - 2) return;
      drawn = now;
      x += dir * (now - last) * 0.06;
      last = now;
      if (x > 1500 || x < 400) dir = -dir;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#e9e3d0';
      const [ox, oy] = small ? [0, 0] : [x, y];
      if (small) canvas.style.transform = `translate(${Math.round(x)}px, ${y}px)`;
      const rows = Math.floor(now / 200) % 2 ? FIGURE.slice(0, 13).concat(STEP) : FIGURE;
      rows.forEach((row, r) => { for (let c = 0; c < 16; c++) if (row[c] === '#') ctx.fillRect(ox + c * S, oy + r * S, S, S); });
    };
    requestAnimationFrame(frame);
  }

  Home.mountClock(document.getElementById('clock'));
  Home.mountBattery(document.getElementById('battery'));
  Home.mountHotbar(document.getElementById('hotbar'));
  Home.mountFinder(document.getElementById('finder'));
  Home.start(stage);
})();
</script>
</body>
</html>
