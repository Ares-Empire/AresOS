// DEVELOPMENT AID of package 25 (the real-game check; copied from package 49b's rig): a Gradle init script (-I) for the rig's runClient. It adds the
// run's JVM arguments (PKG25_JVM_ARGS, split on spaces) and, with PKG25_JAVA, starts the game through the rig's
// java wrapper (jdk/bin/java, which puts it in a scope of its own with MemoryHigh, as the supervisor does).
gradle.allprojects { project ->
    project.tasks.withType(JavaExec).configureEach { task ->
        if (task.name != 'runClient') return
        def extra = System.getenv('PKG25_JVM_ARGS')
        if (extra) task.jvmArgs(extra.trim().split(/\s+/) as List)
        def java = System.getenv('PKG25_JAVA')
        if (java) task.executable = java
    }
}
