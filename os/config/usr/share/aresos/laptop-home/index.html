<!doctype html>
<html lang="en" data-look="day">
<head>
  <meta charset="utf-8">
  <title>AresOS laptop home</title>
  <link rel="stylesheet" href="home.css">
  <script type="module" src="home.js"></script>
</head>
<body>
  <main class="stage" id="stage" hidden>
    <div class="clock" id="clock"><div class="clock-time"></div><div class="clock-date"></div></div>
    <div class="battery" id="battery" hidden>
      <span class="battery-shell" aria-hidden="true"><i></i></span><span class="battery-text"></span>
    </div>
    <div id="town"></div>
    <div class="pad" aria-hidden="true"><i></i></div>
    <div class="hotbar" id="hotbar" aria-label="Hotbar"></div>
    <div class="finder" id="finder">
      <div class="finder-list"></div>
      <div class="finder-line">
        <span class="finder-slash" aria-hidden="true">/</span><span class="finder-q"></span>
        <span class="finder-caret" aria-hidden="true"></span><span class="finder-hint" role="status"></span>
      </div>
    </div>
    <div class="hint label">Click opens · 1 to 9 the hotbar · type to find</div>
  </main>
</body>
</html>
