# /var survives deployment changes. Stock Bazzite's Homebrew prefix stays owned
# by the stock UID 1000 administrator, so a rollback to stock keeps working.
# The daily account (UID 1001) may read and run it; it installs through
# /usr/bin/brew, which runs Homebrew as that owner after sudo asks for his
# password. This entry also replaces the u:1001:--- deny of earlier images.
# Owner, ACL entries for others and all Homebrew contents stay unchanged.
# Reversal, as administrator: setfacl -x u:1001 /var/home/linuxbrew
a+ /var/home/linuxbrew - - - - u:1001:r-x
