# The installer's local passwd/group files survive rebases; create the daily
# account at boot as well as in the pristine image, before greetd/tmpfiles.
g ares 1001
u ares 1001:1001 "AresOS daily session" /var/home/ares /bin/bash
# Everyday account like Windows (owner, 2026-11-09): administrator behind its
# own password. The image sets none, so sudo fails until the owner sets one.
m ares wheel
