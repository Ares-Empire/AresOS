# AresOS image default: readable on the laptop's 1920x1080 screen. foot reads
# only the first foot.ini it finds, so a user's own ~/.config/foot/foot.ini
# replaces this whole file. Every other setting keeps foot's built-in default.
[main]
font=monospace:size=16

# Ctrl+V pastes, as everywhere else; Ctrl+Shift+V still works. Ctrl+C stays "stop the running command"
# (copy with Ctrl+Shift+C). Owner, 2026-11-18.
[key-bindings]
clipboard-paste=Control+v Control+Shift+v XF86Paste
