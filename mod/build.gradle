plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        aresos {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'aresos-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
test {
    useJUnitPlatform()
    def tempDir = layout.buildDirectory.dir('tmp/unit-tests')
    doFirst { tempDir.get().asFile.mkdirs() }
    systemProperty 'java.io.tmpdir', tempDir.get().asFile.absolutePath
    testLogging { events 'passed', 'skipped', 'failed' }
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar { from('LICENSE') { rename { "${it}_aresos" } } }
// The AresOS image pins the jar's SHA-256 (package 23), so the same sources
// must give the same bytes: no build-time timestamps, a fixed entry order.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// The image pins this jar's hash. Keep this block separate from game/test configuration.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    filePermissions { unix('0644') }
    dirPermissions { unix('0755') }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }

// Loom 1.19.2 adds an unsorted client-entry list in a doLast action, with no sorting option.
// Register after Loom's configuration, retain every attribute, and change only serialization order.
afterEvaluate {
    tasks.withType(Jar).configureEach {
        doLast {
            net.fabricmc.loom.util.ZipReprocessorUtil.transformZipEntry(
                archiveFile.get().asFile.toPath(), 'META-INF/MANIFEST.MF', { bytes ->
                    def original = new java.util.jar.Manifest(new ByteArrayInputStream(bytes))
                    def attributes = new TreeMap<String, String>()
                    original.mainAttributes.each { key, value -> attributes[key.toString()] = value.toString() }
                    def clientEntries = 'Fabric-Loom-Client-Only-Entries'
                    if (attributes.containsKey(clientEntries)) {
                        attributes[clientEntries] = attributes[clientEntries].split(';').sort().join(';')
                    }
                    def stable = project.extensions.getByType(JavaPluginExtension).manifest()
                    stable.attributes(attributes)
                    new TreeMap<>(original.entries).each { name, section ->
                        stable.attributes(new TreeMap<>(section.collectEntries { key, value ->
                            [(key.toString()): value.toString()]
                        }), name)
                    }
                    def output = new ByteArrayOutputStream()
                    stable.writeTo(output)
                    output.toByteArray()
                }
            )
        }
    }
}

tasks.named('runClientGameTest') {
    systemProperty 'aresos.disableDiscovery', 'true'
    systemProperty 'aresos.appsReviewDir', file('../reviews/07-real-apps/screenshots').absolutePath
    systemProperty 'aresos.logoReviewDir', file('../reviews/08-walk-in-logos/screenshots').absolutePath
    systemProperty 'aresos.gateReviewDir', file('../reviews/33-gate-logo/screenshots').absolutePath
    systemProperty 'aresos.modeReviewDir', file('../reviews/09-mode-inventories/screenshots').absolutePath
    systemProperty 'aresos.slashNamesReviewDir', file('../reviews/35-slash-names/screenshots').absolutePath
    systemProperty 'aresos.myAppsReviewDir', file('../reviews/34-my-apps/screenshots').absolutePath
    systemProperty 'aresos.reviewDir', file('build/review/01-first-app').absolutePath
    systemProperty 'aresos.homeReviewDir', file('../reviews/04-nether-home/screenshots').absolutePath
    systemProperty 'aresos.hubReviewDir', file('../reviews/32-flat-home/screenshots').absolutePath
    systemProperty 'aresos.townReviewDir', file('../reviews/36-town/screenshots').absolutePath
    systemProperty 'aresos.coloursReviewDir', file('../reviews/39-logo-colours/screenshots').absolutePath
    systemProperty 'aresos.seedReviewDir', file('../reviews/04-nether-home/seeds').absolutePath
    timeout = Duration.ofMinutes(20)
}

tasks.register('searchNetherSeeds', JavaExec) {
    dependsOn tasks.named('gametestClasses')
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'dev.aresos.test.NetherSeedSearch'
    workingDir = file('run')
    doFirst { workingDir.mkdirs() }
    maxHeapSize = '2G'
}

// Development only: prints each gate palette block's average colour, measured from the game's own textures,
// next to the number in GatePalette. Nothing is written; no texture leaves the game's files.
tasks.register('measureBlockColours', JavaExec) {
    dependsOn tasks.named('gametestClasses')
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'dev.aresos.test.BlockColourSurvey'
}

tasks.named('runGameTest') { systemProperty 'aresos.disableDiscovery', 'true' }

sourceSets.gametest.resources.srcDir 'src/test/resources'
// The fake app helper serves the unit tests and the client game tests alike.
sourceSets.test.java.srcDir 'src/testShared/java'
sourceSets.gametest.java.srcDir 'src/testShared/java'
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

// Recovery is explicit and never runs during a build or normal startup.
tasks.register('restoreLegacyApps', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.aresos.config.RestoreLegacyApps'
    doFirst {
        if (!project.hasProperty('appsConfig') || !project.hasProperty('appsBackup'))
            throw new GradleException('Close Minecraft, then provide -PappsConfig=<path> -PappsBackup=<schema-1 or schema-2 backup path>')
        args project.property('appsConfig'), project.property('appsBackup')
    }
}
