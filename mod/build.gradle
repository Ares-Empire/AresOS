plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        aresos {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'aresos-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
test {
    useJUnitPlatform()
    def tempDir = layout.buildDirectory.dir('tmp/unit-tests')
    doFirst { tempDir.get().asFile.mkdirs() }
    systemProperty 'java.io.tmpdir', tempDir.get().asFile.absolutePath
    testLogging { events 'passed', 'skipped', 'failed' }
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar { from('LICENSE') { rename { "${it}_aresos" } } }

tasks.named('runClientGameTest') {
    systemProperty 'aresos.disableDiscovery', 'true'
    systemProperty 'aresos.appsReviewDir', file('../reviews/07-real-apps/screenshots').absolutePath
    systemProperty 'aresos.logoReviewDir', file('../reviews/08-walk-in-logos/screenshots').absolutePath
    systemProperty 'aresos.modeReviewDir', file('../reviews/09-mode-inventories/screenshots').absolutePath
    systemProperty 'aresos.reviewDir', file('build/review/01-first-app').absolutePath
    systemProperty 'aresos.homeReviewDir', file('../reviews/04-nether-home/screenshots').absolutePath
    systemProperty 'aresos.hubReviewDir', file('../reviews/32-flat-home/screenshots').absolutePath
    systemProperty 'aresos.seedReviewDir', file('../reviews/04-nether-home/seeds').absolutePath
    timeout = Duration.ofMinutes(10)
}

tasks.register('searchNetherSeeds', JavaExec) {
    dependsOn tasks.named('gametestClasses')
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'dev.aresos.test.NetherSeedSearch'
    workingDir = file('run')
    doFirst { workingDir.mkdirs() }
    maxHeapSize = '2G'
}

tasks.named('runGameTest') { systemProperty 'aresos.disableDiscovery', 'true' }

sourceSets.gametest.resources.srcDir 'src/test/resources'
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

// Recovery is explicit and never runs during a build or normal startup.
tasks.register('restoreLegacyApps', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.aresos.config.RestoreLegacyApps'
    doFirst {
        if (!project.hasProperty('appsConfig') || !project.hasProperty('appsBackup'))
            throw new GradleException('Close Minecraft, then provide -PappsConfig=<path> -PappsBackup=<schema-1 backup path>')
        args project.property('appsConfig'), project.property('appsBackup')
    }
}
