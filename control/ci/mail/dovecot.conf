# Disposable synthetic fixture only; no relay or submission service.
mail_home = /srv/mail/%Lu
mail_location = sdbox:~/Mail
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000
protocols = imap
listen = *
passdb {
  driver = static
  args = password=pass
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}
ssl = required
ssl_cert = </certs/tls.crt
ssl_key = </certs/tls.key
namespace inbox {
  inbox = yes
  separator = /
  mailbox "Posta" {
    auto = create
    special_use = \Sent
  }
  mailbox "Bozze" {
    auto = create
    special_use = \Drafts
  }
  mailbox "Cestino" {
    auto = create
    special_use = \Trash
  }
  mailbox "Indesiderata" {
    auto = create
    special_use = \Junk
  }
  mailbox "Archivio" {
    auto = create
    special_use = \Archive
  }
}
service imap-login {
  process_min_avail = 1
  service_count = 0
}
log_path = /dev/stdout
info_log_path = /dev/stdout

# SNI selects real alternate roles over the same per-user Dovecot storage.
local_name roles-trash.invalid {
  namespace inbox {
    mailbox "Cestino" {
      special_use =
    }
    mailbox "NewTrash" {
      auto = create
      special_use = \Trash
    }
  }
}

# SNI selects real alternate roles over the same per-user Dovecot storage.
local_name roles-drafts.invalid {
  namespace inbox {
    mailbox "Bozze" {
      special_use =
    }
    mailbox "NewDrafts" {
      auto = create
      special_use = \Drafts
    }
  }
}

# SNI selects real alternate roles over the same per-user Dovecot storage.
local_name roles-sent.invalid {
  namespace inbox {
    mailbox "Posta" {
      special_use =
    }
    mailbox "NewSent" {
      auto = create
      special_use = \Sent
    }
  }
}

local_name roles-missing.invalid {
  namespace inbox {
    mailbox "Cestino" {
      special_use =
    }
  }
}
local_name roles-ambiguous.invalid {
  namespace inbox {
    mailbox "DuplicateTrash" {
      auto = create
      special_use = \Trash
    }
  }
}
