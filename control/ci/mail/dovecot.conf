# Disposable synthetic fixture only; no relay or submission service.
mail_home = /srv/mail/%Lu
mail_location = sdbox:~/Mail
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000
protocols = imap
listen = *
passdb {
  driver = static
  args = password=pass
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}
ssl = required
ssl_cert = </certs/tls.crt
ssl_key = </certs/tls.key
namespace {
  inbox = yes
  separator = /
  mailbox "Posta" {
    auto = create
    special_use = \Sent
  }
  mailbox "Bozze" {
    auto = create
    special_use = \Drafts
  }
  mailbox "Cestino" {
    auto = create
    special_use = \Trash
  }
  mailbox "Indesiderata" {
    auto = create
    special_use = \Junk
  }
  mailbox "Archivio" {
    auto = create
    special_use = \Archive
  }
}
service imap-login {
  process_min_avail = 1
  service_count = 0
}
log_path = /dev/stdout
info_log_path = /dev/stdout
